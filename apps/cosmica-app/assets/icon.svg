<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Cósmica App">
  <defs>
    <linearGradient id="C-bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#0C1628"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>
    <linearGradient id="C-ring" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#0044CC" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="C-arc" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FF2D78"/>
      <stop offset="45%"  stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#00CCEE"/>
    </linearGradient>
    <radialGradient id="C-node" cx="38%" cy="33%" r="65%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="55%"  stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0055EE"/>
    </radialGradient>
    <filter id="C-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background — Android/iOS adaptive icon safe zone -->
  <rect width="512" height="512" rx="96" fill="url(#C-bg)"/>

  <!-- Orbit ring — the core symbol -->
  <circle cx="256" cy="256" r="142" stroke="url(#C-ring)" stroke-width="18"/>

  <!-- Diagonal vector — crosses the ring bottom-left → top-right (magenta → cyan) -->
  <line x1="88" y1="368" x2="424" y2="144"
    stroke="url(#C-arc)" stroke-width="30" stroke-linecap="round"/>

  <!-- Node glow halo — soft ambient behind focal point -->
  <circle cx="372" cy="178" r="48" fill="#00E5FF" opacity="0.14" filter="url(#C-glow)"/>

  <!-- Node — the intersection focal anchor; reads at 48px -->
  <circle cx="372" cy="178" r="26" fill="url(#C-node)"/>

  <!-- Node specular — depth and premium finish -->
  <circle cx="361" cy="167" r="9" fill="white" opacity="0.52"/>
</svg>
