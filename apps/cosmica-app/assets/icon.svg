<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Cósmica App">
  <defs>
    <!-- Planet: magenta top-left → blue bottom-right diagonal -->
    <linearGradient id="g-planet" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FF1870"/>
      <stop offset="50%"  stop-color="#9933CC"/>
      <stop offset="100%" stop-color="#1144EE"/>
    </linearGradient>

    <!-- Pill/ring: orange → magenta → cyan (userSpace so both halves share same gradient) -->
    <linearGradient id="g-pill" x1="58" y1="348" x2="412" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFAA00"/>
      <stop offset="38%"  stop-color="#FF2080"/>
      <stop offset="100%" stop-color="#00CCFF"/>
    </linearGradient>

    <!-- Clip: only pixels to the right of x=205 (front half of pill, over planet) -->
    <clipPath id="clip-pill-front">
      <rect x="200" y="0" width="312" height="512"/>
    </clipPath>

    <!-- Planet soft glow -->
    <filter id="f-planet" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Pill edge glow -->
    <filter id="f-pill" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Ambient scatter -->
    <filter id="f-ambient" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Ambient glow from below-center (blue light scatter) -->
  <ellipse cx="290" cy="395" rx="110" ry="45" fill="#0055EE" opacity="0.18" filter="url(#f-ambient)"/>
  <ellipse cx="390" cy="285" rx="80"  ry="35" fill="#00AAFF" opacity="0.10" filter="url(#f-ambient)"/>

  <!-- ─── PILL BACK HALF (orange end, behind planet — drawn first) ─── -->
  <!-- Pill: midpoint (235,235), half-length≈211, angle≈-33°, half-width=52 -->
  <g filter="url(#f-pill)">
    <rect x="-211" y="-52" width="422" height="104" rx="52"
      transform="translate(235,235) rotate(-33)"
      fill="url(#g-pill)" opacity="0.90"/>
  </g>

  <!-- ─── PLANET (covers back portion of pill) ─── -->
  <circle cx="212" cy="268" r="126" fill="url(#g-planet)" filter="url(#f-planet)"/>

  <!-- ─── ORBITAL RING HALO (cyan stroke circle, offset upper-right) ─── -->
  <circle cx="272" cy="226" r="140" stroke="#00CCFF" stroke-width="2.5" opacity="0.62"/>

  <!-- ─── PILL FRONT HALF (cyan end, in front of planet) ─── -->
  <g clip-path="url(#clip-pill-front)" filter="url(#f-pill)">
    <rect x="-211" y="-52" width="422" height="104" rx="52"
      transform="translate(235,235) rotate(-33)"
      fill="url(#g-pill)" opacity="0.90"/>
  </g>

  <!-- ─── 4-POINTED SPARKLE STAR (black, in cyan cap) ─── -->
  <g transform="translate(385,178)">
    <!-- Main star -->
    <path d="M0,-18 C1.2,-4.5 4.5,-1.2 18,0 C4.5,1.2 1.2,4.5 0,18 C-1.2,4.5 -4.5,1.2 -18,0 C-4.5,-1.2 -1.2,-4.5 0,-18 Z"
      fill="#000000"/>
    <!-- Tiny secondary sparkle -->
    <path d="M0,-8 C0.5,-2 2,-0.5 8,0 C2,0.5 0.5,2 0,8 C-0.5,2 -2,0.5 -8,0 C-2,-0.5 -0.5,-2 0,-8 Z"
      transform="translate(13,-16)" fill="#000000" opacity="0.65"/>
  </g>

  <!-- ─── SCATTER PARTICLES ─── -->
  <circle cx="188" cy="404" r="2.8" fill="#00DDFF" opacity="0.38"/>
  <circle cx="232" cy="418" r="1.8" fill="#00DDFF" opacity="0.26"/>
  <circle cx="268" cy="408" r="1.2" fill="#44AAFF" opacity="0.20"/>
  <circle cx="308" cy="390" r="2.0" fill="#00DDFF" opacity="0.14"/>
</svg>
