<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Cósmica">
  <defs>
    <linearGradient id="f-arc" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FF2D78"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#060A12"/>
  <!-- Orbit ring -->
  <circle cx="16" cy="16" r="9" stroke="#00E5FF" stroke-width="1.6" stroke-opacity="0.7"/>
  <!-- Vector arc -->
  <line x1="5.5" y1="23" x2="26.5" y2="9"
    stroke="url(#f-arc)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Node -->
  <circle cx="23.3" cy="11.2" r="2.8" fill="#00E5FF"/>
  <!-- Node specular -->
  <circle cx="22.2" cy="10.1" r="1" fill="white" opacity="0.65"/>
</svg>
