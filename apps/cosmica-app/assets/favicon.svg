<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Cósmica">
  <defs>
    <linearGradient id="f-planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FF1870"/>
      <stop offset="100%" stop-color="#1144EE"/>
    </linearGradient>
    <linearGradient id="f-pill" x1="3" y1="22" x2="26" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFAA00"/>
      <stop offset="40%"  stop-color="#FF2080"/>
      <stop offset="100%" stop-color="#00CCFF"/>
    </linearGradient>
    <clipPath id="f-front">
      <rect x="13" y="0" width="19" height="32"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" fill="#000"/>

  <!-- Pill back (behind planet) -->
  <rect x="-13" y="-3.5" width="26" height="7" rx="3.5"
    transform="translate(14.5,15) rotate(-33)"
    fill="url(#f-pill)"/>

  <!-- Planet -->
  <circle cx="13" cy="17" r="8" fill="url(#f-planet)"/>

  <!-- Orbital ring -->
  <circle cx="17" cy="14" r="8.5" stroke="#00CCFF" stroke-width="1.2" opacity="0.6"/>

  <!-- Pill front (in front of planet) -->
  <g clip-path="url(#f-front)">
    <rect x="-13" y="-3.5" width="26" height="7" rx="3.5"
      transform="translate(14.5,15) rotate(-33)"
      fill="url(#f-pill)"/>
  </g>

  <!-- Sparkle dot (simplified at this scale) -->
  <path d="M25,10 C25.4,12 26.8,12 27,12 C26.8,12 25.4,12 25,14 C24.6,12 23.2,12 23,12 C23.2,12 24.6,12 25,10 Z"
    fill="#000" opacity="0.85"/>
</svg>
