<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cósmica App</title>

  <!-- SEO & PWA -->
  <meta name="description" content="Sistema de gestión para talleres de reparación — tickets, inventario y finanzas.">
  <meta name="theme-color" content="#00e5ff">
  <meta name="color-scheme" content="dark">

  <!-- PWA / Install -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cósmica App">

  <!-- Favicon / tab icon — SVG first (sharp at all sizes), PNG fallback -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">

  <!-- Apple touch icon -->
  <link rel="apple-touch-icon" sizes="192x192" href="assets/icon-192.png">

  <link rel="stylesheet" href="../../styles/design-system.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Ajustes de Layout para el SaaS */
    :root {
      --navbar-h: 65px;
      --sidebar-w: 250px;
    }

    .sidebar {
      top: var(--navbar-h);
      height: calc(100vh - var(--navbar-h));
      background: rgba(5, 11, 20, 0.8);
      width: var(--sidebar-w);
    }

    .main-content {
      padding: var(--space-lg);
      padding-top: calc(var(--navbar-h) + 16px);
      padding-bottom: var(--space-xl);
      transition: padding var(--transition-fast), opacity var(--transition-normal);
      box-sizing: border-box;
    }

    /* Mobile Overrides (Operational Pass & Native Feel Pass) */
    @media (max-width: 768px) {
      :root {
        --navbar-h: 44px; /* Slimmer navbar - iOS standard height */
        
        /* Mobile Spacing Pass: Tighten CSS space variables globally on mobile */
        --space-xs: 4px;
        --space-sm: 6px;
        --space-md: 12px;
        --space-lg: 16px;
        --space-xl: 20px;
        --space-2xl: 28px;
        --space-3xl: 36px;
      }

      /* iOS Safari zoom prevention */
      input, select, textarea {
        font-size: 16px !important;
      }

      body {
        /* Extra padding-bottom so body content scrolls past the fixed bottom nav */
        padding-bottom: calc(60px + env(safe-area-inset-bottom, 12px)) !important;
      }

      .main-content {
        overscroll-behavior: none;
        padding: var(--space-sm); /* Maximum density for mobile */
        padding-top: calc(var(--navbar-h) + env(safe-area-inset-top, 0px) + 12px) !important;
      }
      
      /* Mobile Navbar Compaction */
      .navbar {
        padding: env(safe-area-inset-top, 0px) var(--space-sm) 0 !important;
        height: calc(var(--navbar-h) + env(safe-area-inset-top, 0px)) !important;
      }
      .navbar-logo {
        gap: 0 !important;
      }
      .navbar-logo img {
        height: 24px !important;
        width: 24px !important;
      }
      .navbar-logo span {
        display: none !important;
      }
      .menu-toggle {
        display: none !important; /* Hide hamburger menu in favor of bottom nav "Más" button */
      }
      .cp-trigger-btn {
        padding: 4px 8px !important;
        font-size: 11px !important;
      }
      .cp-trigger-btn kbd {
        display: none !important;
      }
      #btnPerfil {
        padding: 4px 8px !important;
        font-size: 11px !important;
        height: 28px !important;
        min-height: 28px !important;
        line-height: 1 !important;
      }

      /* Mobile Sidebar Minimization */
      .sidebar {
        top: 0 !important;
        height: 100vh !important;
        width: 240px !important; /* Reduced width */
        background: rgba(6, 11, 20, 0.96) !important; /* Premium dark background */
        backdrop-filter: blur(24px) !important;
        -webkit-backdrop-filter: blur(24px) !important;
        border-right: 1px solid rgba(255, 255, 255, 0.05) !important;
        box-shadow: 10px 0 40px rgba(0, 0, 0, 0.6) !important;
        transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1) !important; /* Faster transition */
        padding: var(--space-md) !important;
        z-index: 10000 !important; /* Above bottom nav overlays */
      }

      .sidebar-nav {
        gap: var(--space-xs) !important;
        padding-top: calc(20px + env(safe-area-inset-top, 0px)) !important;
      }

      /* Touch ergonomics for sidebar links */
      .sidebar-link {
        padding: 12px 16px !important;
        border-radius: var(--radius-md) !important;
        margin-bottom: var(--space-xs) !important;
      }

      /* Sidebar backdrop overlay */
      .sidebar-overlay {
        position: fixed;
        inset: 0;
        background: rgba(3, 5, 10, 0.6);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        z-index: 9998; /* right under sidebar */
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.24s ease;
      }
      .sidebar-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }

      /* Bottom Mobile Navigation */
      .mobile-bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: calc(60px + env(safe-area-inset-bottom, 12px));
        background: rgba(6, 11, 20, 0.94);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        display: flex !important;
        justify-content: space-around;
        align-items: stretch;
        z-index: 9999; /* Ensure it is on top of everything */
        padding-bottom: env(safe-area-inset-bottom, 12px);
        box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.5);
      }
      .mobile-nav-link {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 1;
        height: 100%;
        background: none;
        border: none;
        color: var(--text-muted);
        text-decoration: none;
        font-family: inherit;
        transition: color 0.15s cubic-bezier(0.4, 0, 0.2, 1),
                    transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        gap: 3px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        position: relative;
        padding-top: 6px;
      }
      .mobile-nav-icon {
        font-size: 20px;
        font-style: normal;
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                    color 0.2s ease;
      }
      .mobile-nav-label {
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.03em;
        transition: color 0.2s ease;
      }
      /* Active state styles */
      .mobile-nav-link.active {
        color: var(--accent-cyan);
      }
      .mobile-nav-link.active .mobile-nav-icon {
        transform: translateY(-2px) scale(1.1);
        text-shadow: 0 0 12px var(--accent-cyan-glow);
      }
      /* Active pip — tiny elegant dot under label instead of top border indicator */
      .mobile-nav-link::after {
        content: '';
        position: absolute;
        bottom: 2px;
        left: 50%;
        transform: translateX(-50%) scale(0);
        width: 4px;
        height: 4px;
        background: var(--accent-cyan);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent-cyan-glow);
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                    opacity 0.2s ease;
        opacity: 0;
      }
      .mobile-nav-link.active::after {
        transform: translateX(-50%) scale(1);
        opacity: 1;
      }
      .mobile-nav-link:active .mobile-nav-icon {
        transform: scale(0.9);
      }

      /* Profile avatar button — circular initial instead of text */
      #btnPerfil {
        width: 32px !important;
        height: 32px !important;
        min-height: 32px !important;
        padding: 0 !important;
        border-radius: 50% !important;
        background: linear-gradient(135deg, var(--accent-blue, #0066ff), var(--accent-cyan)) !important;
        color: #060A12 !important;
        font-size: 13px !important;
        font-weight: 800 !important;
        letter-spacing: -0.01em !important;
        line-height: 1 !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        border: none !important;
        flex-shrink: 0;
      }

      /* Drawer Fullscreen Mobile */
      .drawer-panel {
        width: 100% !important;
        height: 100% !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        max-width: 100vw !important;
        border-radius: 0 !important;
        transform: translateY(100%) !important;
        transition: transform 0.4s cubic-bezier(0.32, 0.94, 0.6, 1) !important;
        z-index: 910 !important;
      }
      .drawer-panel.is-open {
        transform: translateY(0) !important;
      }
      .drawer-header {
        padding-top: calc(var(--space-md) + env(safe-area-inset-top, 16px)) !important;
        background: rgba(8, 15, 28, 0.98) !important;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .drawer-footer {
        padding-bottom: calc(var(--space-md) + env(safe-area-inset-bottom, 16px)) !important;
      }
      .drawer-body {
        overscroll-behavior: contain !important;
        -webkit-overflow-scrolling: touch !important;
      }

      /* Densidad operacional en cards */
      .glass-card {
        padding: var(--space-md) !important; /* Slightly more precise card padding */
      }

      /* Mobile Card Pass: Touch targets, single-row actions, hierarchy */
      .glass-card .btn {
        min-height: 44px !important;
        font-size: 11px !important;
        font-weight: 700 !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
      }
      
      .glass-card > div:last-child > div {
        display: flex !important;
        flex-wrap: nowrap !important;
        gap: 6px !important;
        width: 100% !important;
        box-sizing: border-box !important;
      }

      .glass-card > div:last-child > div > button.quick-tomar-btn,
      .glass-card > div:last-child > div > button.quick-listo-btn,
      .glass-card > div:last-child > div > button.quick-entregar-btn,
      .glass-card > div:last-child > div > button.reingreso-btn {
        flex: 1 !important;
        min-width: 0 !important;
      }

      /* Hide extra overlays and unnecessary elements on mobile */
      .space-bg .glow-point {
        opacity: 0.15 !important; /* Muted background glow to avoid visual chaos */
        filter: blur(120px) !important;
      }

      /* Reduce margin under search bar and grid */
      .operational-controls {
        margin-bottom: var(--space-sm) !important;
      }
      #tickets-grid {
        margin-top: var(--space-sm) !important;
      }
    }

    /* Fix z-index for autocompletes */
    #cliente-suggestions, .autocomplete-results {
      z-index: 9999 !important;
    }

    /* Shell oculto hasta confirmar sesión */
    .sidebar { display: none; }
    .navbar-actions { display: none; }
    .main-content { margin-left: 0; }

    /* Mobile bottom nav — only visible on mobile breakpoints.
       Without this, the populated <nav> bleeds into desktop layout. */
    .mobile-bottom-nav { display: none; }

    /* Shell visible cuando sesión confirmada */
    body.session-ready .sidebar { display: block; }
    body.session-ready .navbar-actions { display: flex; gap: var(--space-sm); align-items: center; }
    body.session-ready .main-content { margin-left: var(--sidebar-w); }
    @media (max-width: 768px) {
      body.session-ready .main-content { margin-left: 0; }
      body.session-ready .sidebar { display: block; transform: translateX(-100%); }
      body.session-ready .sidebar.active { transform: translateX(0); }
    }

    /* M5 — Sidebar scroll en pantallas cortas */
    .sidebar-nav {
      overflow-y: auto;
      height: 100%;
    }

    /* C2 — Estado visual de botones de filtro */
    .btn-filter { opacity: 0.5; }
    .btn-filter.active {
      opacity: 1;
      background: rgba(0, 255, 255, 0.15);
      border-color: var(--accent-cyan);
    }

    /* C4 — Filtros de tickets en mobile */
    @media (max-width: 768px) {
      .operational-controls-filters {
        flex-direction: column;
        align-items: stretch;
      }
      .filter-group { flex-wrap: wrap; }
    }

    /* M1 — Search wrapper sin min-width en mobile */
    @media (max-width: 768px) {
      .search-wrapper-mobile {
        max-width: 100% !important;
        min-width: 0 !important;
        width: 100%;
      }
    }

    /* ── Global UX hardening ────────────────────────────── */

    /* Prevent accidental horizontal scroll from any overflowing element */
    body {
      overflow-x: hidden;
    }

    /* Prevent pull-to-refresh gesture while scrolling page content on iOS */
    .main-content {
      overscroll-behavior-y: contain;
    }

    /* Prevent double-tap zoom on all buttons/links (iOS UX — no delay) */
    .btn, button, a, select, input[type="button"], input[type="submit"] {
      touch-action: manipulation;
    }

    /* ── Dropdown perfil ─────────────────────────────────── */
    .perfil-dropdown {
      position: fixed;
      top: calc(var(--navbar-h) + 8px);
      right: var(--space-lg);
      z-index: 150;
      background: rgba(8, 15, 28, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-md);
      min-width: 220px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      display: none;
      transform: translateY(-8px);
      transition: transform var(--transition-fast), opacity var(--transition-fast);
      opacity: 0;
    }
    .perfil-dropdown.open { 
      display: block; 
      transform: translateY(0);
      opacity: 1;
    }

    /* ── Navbar overflow protection ───────────────────────── */
    .navbar-email {
      font-size: var(--font-sm);
      color: var(--text-muted);
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    @media (max-width: 600px) {
      .navbar-email { display: none; }
      .cp-trigger-btn kbd { display: none; }
      .navbar-actions { gap: var(--space-xs) !important; }
    }
    /* Hide caja status indicator on very small phones (≤480px) to prevent
       navbar overflow — caja info is accessible in the Finanzas view */
    @media (max-width: 480px) {
      #caja-status-indicator { display: none !important; }
    }
  </style>
</head>
<body>

  <!-- Space Background -->
  <div class="space-bg">
    <div class="glow-point glow-point-1"></div>
    <div class="glow-point glow-point-2"></div>
    <div class="glow-point glow-point-3"></div>
  </div>

  <!-- Topbar (Navbar) -->
  <nav class="navbar">
    <div class="navbar-logo">
      <img src="assets/icon.svg" alt="Cósmica" style="height: 32px; width: 32px; object-fit: contain; flex-shrink:0;">
      <span>Cósmica App</span>
    </div>
    <button class="menu-toggle" aria-label="Abrir menú">☰</button>
    <div class="navbar-actions">
      <div id="caja-status-indicator" style="display: none; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); text-transform: uppercase; letter-spacing: 0.05em;"></div>
      <button id="cp-trigger-btn" class="cp-trigger-btn" title="Búsqueda global (Ctrl+K)">
        <span>🔍</span>
        <kbd>Ctrl K</kbd>
      </button>
      <span id="userEmail" class="navbar-email"></span>
      <button class="btn btn-primary" id="btnPerfil">Perfil</button>
    </div>
  </nav>

  <!-- Dropdown perfil -->
  <div class="perfil-dropdown" id="perfilDropdown">
    <div class="perfil-email" id="perfilEmail"></div>
    <button class="btn btn-secondary" id="btnInstallPWA" style="width:100%; margin-bottom: 8px; display: none; background: rgba(0,229,255,0.1); color: var(--accent-cyan); border: 1px solid rgba(0,229,255,0.2);">📲 Instalar App</button>
    <button class="btn btn-secondary" id="btnLogout" style="width:100%;">Cerrar sesión</button>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-nav">
      <a href="#dashboard" class="sidebar-link active">
        <i>📊</i> Dashboard
      </a>
      <a href="#tickets" class="sidebar-link">
        <i>🛠️</i> Trabajos
      </a>
      <a href="#inventario" class="sidebar-link">
        <i>📦</i> Inventario
      </a>
      <a href="#clientes" class="sidebar-link">
        <i>👥</i> Clientes
      </a>
      <a href="#configuracion" class="sidebar-link">
        <i>⚙️</i> Configuración
      </a>
    </div>
    <div style="position: absolute; bottom: 20px; left: 20px; font-size: 10px; color: var(--text-muted); opacity: 0.5; letter-spacing: 1px; font-weight: 700;">
      VERSIÓN V1
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div id="app-loader" style="display:flex;flex-direction:column;gap:var(--space-xl);opacity:0.6;">
      <div class="skeleton" style="width:250px;height:32px;border-radius:8px;"></div>
      <div class="grid-stack" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));">
        <div class="skeleton" style="height:120px;border-radius:var(--radius-md);"></div>
        <div class="skeleton" style="height:120px;border-radius:var(--radius-md);"></div>
        <div class="skeleton" style="height:120px;border-radius:var(--radius-md);"></div>
        <div class="skeleton" style="height:120px;border-radius:var(--radius-md);"></div>
      </div>
      <div class="skeleton" style="height:400px;border-radius:var(--radius-lg);"></div>
    </div>
  </main>

  <!-- Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Bottom Navigation for Mobile -->
  <nav class="mobile-bottom-nav" id="bottom-nav"></nav>

  <script type="module" src="./core/app.js"></script>
</body>
</html>
