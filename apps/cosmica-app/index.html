<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cósmica SaaS</title>

  <!-- SEO & PWA -->
  <meta name="description" content="Sistema de gestión para talleres de reparación — tickets, inventario y finanzas.">
  <meta name="theme-color" content="#00e5ff">
  <meta name="color-scheme" content="dark">

  <!-- PWA / Install -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cósmica">

  <!-- Apple touch icon (falls back to manifest icons on most platforms) -->
  <link rel="apple-touch-icon" href="assets/icon-192.png">

  <link rel="stylesheet" href="../../styles/design-system.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Ajustes de Layout para el SaaS */
    :root {
      --navbar-h: 65px;
      --sidebar-w: 250px;
    }

    .sidebar {
      top: var(--navbar-h);
      height: calc(100vh - var(--navbar-h));
      background: rgba(5, 11, 20, 0.8);
      width: var(--sidebar-w);
    }

    .main-content {
      padding: var(--space-xl);
      padding-top: calc(var(--navbar-h) + 25px);
      min-height: 100vh;
      transition: all var(--transition-normal);
    }

    /* Mobile Overrides (Operational Pass) */
    @media (max-width: 768px) {
      :root {
        --navbar-h: 55px; /* Navbar más delgada en mobile */
      }
      
      .navbar {
        padding: 0 var(--space-md);
        height: var(--navbar-h);
      }

      .sidebar {
        top: var(--navbar-h);
        height: calc(100vh - var(--navbar-h));
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        width: 280px; /* Un poco más ancho para touch */
      }

      .sidebar.active {
        transform: translateX(0);
      }

      .main-content {
        margin-left: 0;
        padding: var(--space-md); /* Menos padding lateral */
        padding-top: calc(var(--navbar-h) + 15px);
      }

      /* Densidad operacional en cards */
      .glass-card {
        padding: var(--space-md) !important;
      }

      /* Ajuste de gaps en grids */
      .grid-stack-mobile {
        gap: var(--space-md) !important;
      }

      /* Buscadores y filtros */
      .operational-controls {
        flex-direction: column !important;
        align-items: stretch !important;
        gap: var(--space-sm) !important;
      }

      .search-wrapper-mobile {
        max-width: 100% !important;
      }

      /* Formularios más compactos */
      .form-group {
        margin-bottom: var(--space-md) !important;
      }
      
      .navbar-logo {
        font-size: var(--font-md) !important;
      }
    }

    /* Fix z-index for autocompletes */
    #cliente-suggestions, .autocomplete-results {
      z-index: 9999 !important;
    }

    /* Shell oculto hasta confirmar sesión */
    .sidebar { display: none; }
    .navbar-actions { display: none; }
    .main-content { margin-left: 0; }

    /* Shell visible cuando sesión confirmada */
    body.session-ready .sidebar { display: block; }
    body.session-ready .navbar-actions { display: flex; gap: var(--space-sm); align-items: center; }
    body.session-ready .main-content { margin-left: var(--sidebar-w); }
    @media (max-width: 768px) {
      body.session-ready .main-content { margin-left: 0; }
      body.session-ready .sidebar { display: block; transform: translateX(-100%); }
      body.session-ready .sidebar.active { transform: translateX(0); }
    }

    /* M5 — Sidebar scroll en pantallas cortas */
    .sidebar-nav {
      overflow-y: auto;
      height: 100%;
    }

    /* C2 — Estado visual de botones de filtro */
    .btn-filter { opacity: 0.5; }
    .btn-filter.active {
      opacity: 1;
      background: rgba(0, 255, 255, 0.15);
      border-color: var(--accent-cyan);
    }

    /* C4 — Filtros de tickets en mobile */
    @media (max-width: 768px) {
      .operational-controls-filters {
        flex-direction: column;
        align-items: stretch;
      }
      .filter-group { flex-wrap: wrap; }
    }

    /* M1 — Search wrapper sin min-width en mobile */
    @media (max-width: 768px) {
      .search-wrapper-mobile {
        max-width: 100% !important;
        min-width: 0 !important;
        width: 100%;
      }
    }

    /* ── Global UX hardening ────────────────────────────── */

    /* Prevent accidental horizontal scroll from any overflowing element */
    body {
      overflow-x: hidden;
    }

    /* Prevent pull-to-refresh gesture while scrolling page content on iOS */
    .main-content {
      overscroll-behavior-y: contain;
    }

    /* Prevent double-tap zoom on all buttons/links (iOS UX — no delay) */
    .btn, button, a, select, input[type="button"], input[type="submit"] {
      touch-action: manipulation;
    }

    /* ── Dropdown perfil ─────────────────────────────────── */
    .perfil-dropdown {
      position: fixed;
      top: calc(var(--navbar-h) - 5px);
      right: var(--space-lg);
      /* Elevated above drawer-overlay (z:200) and drawer-panel (z:201) */
      z-index: 300;
      background: rgba(5, 11, 20, 0.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      min-width: 200px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      display: none;
    }
    .perfil-dropdown.open { display: block; }

    /* ── Navbar overflow protection ───────────────────────── */
    .navbar-email {
      font-size: var(--font-sm);
      color: var(--text-muted);
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    @media (max-width: 600px) {
      .navbar-email { display: none; }
      .cp-trigger-btn kbd { display: none; }
      .navbar-actions { gap: var(--space-xs) !important; }
    }
    /* Hide caja status indicator on very small phones (≤480px) to prevent
       navbar overflow — caja info is accessible in the Finanzas view */
    @media (max-width: 480px) {
      #caja-status-indicator { display: none !important; }
    }
  </style>
</head>
<body>

  <!-- Space Background -->
  <div class="space-bg">
    <div class="glow-point glow-point-1"></div>
    <div class="glow-point glow-point-2"></div>
    <div class="glow-point glow-point-3"></div>
  </div>

  <!-- Topbar (Navbar) -->
  <nav class="navbar">
    <div class="navbar-logo">
      <span>🚀</span> Cósmica SaaS
    </div>
    <button class="menu-toggle" aria-label="Abrir menú">☰</button>
    <div class="navbar-actions">
      <div id="caja-status-indicator" style="display: none; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); text-transform: uppercase; letter-spacing: 0.05em;"></div>
      <button id="cp-trigger-btn" class="cp-trigger-btn" title="Búsqueda global (Ctrl+K)">
        <span>🔍</span>
        <kbd>Ctrl K</kbd>
      </button>
      <span id="userEmail" class="navbar-email"></span>
      <button class="btn btn-primary" id="btnPerfil">Perfil</button>
    </div>
  </nav>

  <!-- Dropdown perfil -->
  <div class="perfil-dropdown" id="perfilDropdown">
    <div class="perfil-email" id="perfilEmail"></div>
    <button class="btn btn-secondary" id="btnLogout" style="width:100%;">Cerrar sesión</button>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-nav">
      <a href="#dashboard" class="sidebar-link active">
        <i>📊</i> Dashboard
      </a>
      <a href="#tickets" class="sidebar-link">
        <i>🛠️</i> Trabajos
      </a>
      <a href="#inventario" class="sidebar-link">
        <i>📦</i> Inventario
      </a>
      <a href="#clientes" class="sidebar-link">
        <i>👥</i> Clientes
      </a>
      <a href="#configuracion" class="sidebar-link">
        <i>⚙️</i> Configuración
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div id="app-loader" style="display:flex;flex-direction:column;gap:var(--space-xl);opacity:0.6;">
      <div class="skeleton" style="width:250px;height:32px;border-radius:8px;"></div>
      <div class="grid-stack" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));">
        <div class="skeleton" style="height:120px;border-radius:var(--radius-md);"></div>
        <div class="skeleton" style="height:120px;border-radius:var(--radius-md);"></div>
        <div class="skeleton" style="height:120px;border-radius:var(--radius-md);"></div>
        <div class="skeleton" style="height:120px;border-radius:var(--radius-md);"></div>
      </div>
      <div class="skeleton" style="height:400px;border-radius:var(--radius-lg);"></div>
    </div>
  </main>

  <script type="module" src="./core/app.js"></script>
</body>
</html>
