<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmica.ar — Acceso</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050B14;
      --surface: rgba(15, 23, 42, 0.6);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #FF5E00; /* Vibrant Orange */
      --accent-dim: rgba(255,94,0,.08);
      --accent2: #00E5FF; /* Electric Blue */
      --text: #F8FAFC;
      --muted: #94A3B8;
      --danger: #FF007F; /* Magenta */
      --radius-pill: 50px;
      --radius-card: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Fondo animado */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(0,229,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 20s linear infinite;
    }
    @keyframes gridMove {
      0%   { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }
    .bg-glow {
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(0,229,255,.06) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      pointer-events: none; z-index: 0;
    }

    /* Card */
    .card {
      position: relative; z-index: 1;
      background: var(--surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 80px rgba(0,0,0,.6), 0 0 40px rgba(0,229,255,.04);
      animation: fadeUp .5s ease both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(20px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .logo {
      text-align: center;
      margin-bottom: 36px;
    }
    .logo-icon {
      width: 64px; height: 64px;
      background: rgba(0,229,255,0.05);
      border: 1px solid rgba(0,229,255,.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px;
      padding: 10px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,229,255,0.2);
    }
    .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <img src="cosmica-logo.png" alt="Cosmica.ar">
    </div>
    <div class="logo-title">Cosmica<span>.ar</span></div>
    <div class="logo-sub">Sistema de gestión</div>
  </div>

  <div class="form-group">
    <label>Email</label>
    <input id="email" type="email" placeholder="usuario@cosmica.ar" autocomplete="username">
  </div>

  <div class="form-group">
    <label>Contraseña</label>
    <input id="password" type="password" placeholder="••••••••"
      autocomplete="current-password"
      onkeydown="if(event.key==='Enter') login()">
  </div>

  <button class="btn-login" id="btnLogin" onclick="login()">Ingresar</button>
  <div class="error-msg" id="errorMsg"></div>

  <div class="footer-text">Cosmica.ar © 2026 — Jujuy, Argentina</div>
</div>

<script type="module" src="./js/login.js"></script>

</body>
</html>
