<!DOCTYPE html>
<html>
<head>
  <title>Login Cósmica</title>
</head>
<body>

<h2>Ingreso al sistema</h2>

<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Contraseña" onkeydown="if(event.key==='Enter'){login()}"><br><br>

<button onclick="login()">Ingresar</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgRCLYvSPLG4PIqPjHFGsPhu0EoxTLKCU",
  authDomain: "cosmica-clientes.firebaseapp.com",
  projectId: "cosmica-clientes",
  storageBucket: "cosmica-clientes.appspot.com",
  messagingSenderId: "875572379632",
  appId: "1:875572379632:web:db73498c6ffc9ec679a735"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

window.login = async ()=>{
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  try{
    await signInWithEmailAndPassword(auth, email, pass);
    window.location.href = "panel.html";
  }
  catch(e){
  alert("Error: " + e.message);
}
};
</script>

</body>
</html>
