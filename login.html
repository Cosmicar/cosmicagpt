<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmica.ar — Acceso</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07080f;
      --surface: #0e0f1a;
      --border: #1e2035;
      --accent: #00ffcc;
      --accent-dim: rgba(0,255,204,.08);
      --text: #dde2f0;
      --muted: #6b7094;
      --danger: #ff4d6d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Fondo animado */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(0,255,204,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,204,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 20s linear infinite;
    }
    @keyframes gridMove {
      0%   { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }
    .bg-glow {
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(0,255,204,.06) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      pointer-events: none; z-index: 0;
    }

    /* Card */
    .card {
      position: relative; z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 80px rgba(0,0,0,.6), 0 0 40px rgba(0,255,204,.04);
      animation: fadeUp .5s ease both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(20px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .logo {
      text-align: center;
      margin-bottom: 36px;
    }
    .logo-icon {
      width: 56px; height: 56px;
      background: var(--accent-dim);
      border: 1px solid rgba(0,255,204,.2);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      margin: 0 auto 14px;
    }
    .logo-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--accent);
    }
    .logo-title span { color: var(--text); }
    .logo-sub {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* Form */
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--muted);
      margin-bottom: 7px;
    }
    input {
      width: 100%;
      background: #080910;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 13px 16px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,255,204,.08);
    }
    input::placeholder { color: var(--muted); }

    .btn-login {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 8px;
      transition: all .2s;
    }
    .btn-login:hover {
      background: #00e8b8;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0,255,204,.2);
    }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled {
      background: #1a2a25;
      color: #2a5a4a;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Error */
    .error-msg {
      background: rgba(255,77,109,.1);
      border: 1px solid rgba(255,77,109,.3);
      color: var(--danger);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
    .error-msg.show { display: block; animation: shake .3s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }

    .footer-text {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 32px;
      letter-spacing: .5px;
    }
  </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="card">
  <div class="logo">
    <div class="logo-icon">🛰️</div>
    <div class="logo-title">Cosmica<span>.ar</span></div>
    <div class="logo-sub">Sistema de gestión</div>
  </div>

  <div class="form-group">
    <label>Email</label>
    <input id="email" type="email" placeholder="usuario@cosmica.ar" autocomplete="username">
  </div>

  <div class="form-group">
    <label>Contraseña</label>
    <input id="password" type="password" placeholder="••••••••"
      autocomplete="current-password"
      onkeydown="if(event.key==='Enter') login()">
  </div>

  <button class="btn-login" id="btnLogin" onclick="login()">Ingresar</button>
  <div class="error-msg" id="errorMsg"></div>

  <div class="footer-text">Cosmica.ar © 2026 — Jujuy, Argentina</div>
</div>

<script type="module" src="./js/login.js"></script>

</body>
</html>
