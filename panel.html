<!DOCTYPE html>
<html>
<head>
  <title>Panel Cósmica</title>
</head>
<body>

<h2>Ingreso de trabajo</h2>
<p style="color:red; font-size:14px;">* Campos obligatorios</p>

<label>Nombre <span style="color:red">*</span></label><br>
<input id="nombre" oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '')"><br>

<label>Apellido</label><br>
<input id="apellido" oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '')"><br>

<label>DNI <span style="color:red">*</span></label><br>
<input id="dni" onblur="buscarCliente()" inputmode="numeric" pattern="[0-9]*" oninput="this.value = this.value.replace(/[^0-9]/g, '')"><br>

<label>Teléfono <span style="color:red">*</span></label><br>
<input id="telefono" inputmode="numeric" pattern="[0-9]*" oninput="this.value = this.value.replace(/[^0-9]/g, '')"><br>

<label>Provincia <span style="color:red">*</span></label><br>
<select id="provincia">
  <option value="">Seleccionar provincia *</option>
  <option>Buenos Aires</option>
  <option>CABA</option>
  <option>Catamarca</option>
  <option>Chaco</option>
  <option>Chubut</option>
  <option>Córdoba</option>
  <option>Corrientes</option>
  <option>Entre Ríos</option>
  <option>Formosa</option>
  <option>Jujuy</option>
  <option>La Pampa</option>
  <option>La Rioja</option>
  <option>Mendoza</option>
  <option>Misiones</option>
  <option>Neuquén</option>
  <option>Río Negro</option>
  <option>Salta</option>
  <option>San Juan</option>
  <option>San Luis</option>
  <option>Santa Cruz</option>
  <option>Santa Fe</option>
  <option>Santiago del Estero</option>
  <option>Tierra del Fuego</option>
  <option>Tucumán</option>
</select><br><br>

<select id="tipo">
  <option value="taller">Taller</option>
  <option value="remoto">Remoto</option>
</select><br>

<label>Equipo <span style="color:red">*</span></label><br>
<input id="equipo" placeholder="PC, notebook, impresora"><br>

<label>Marca</label><br>
<input id="marca"><br>

<label>Modelo</label><br>
<input id="modelo"><br>

<label>Descripción del problema <span style="color:red">*</span></label><br>
<textarea id="problema"></textarea><br>

<button id="btnGuardar" onclick="guardarCliente()">Guardar ingreso</button>

<h2>Trabajos registrados</h2>
<div id="listaTrabajos"></div>

<script type="module">
import { 
  getFirestore, 
  collection, 
  addDoc, 
  getDocs, 
  doc, 
  query,
  where,
  updateDoc 
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgRCLYvSPLG4PIqPjHFGsPhu0EoxTLKCU",
  authDomain: "cosmica-clientes.firebaseapp.com",
  projectId: "cosmica-clientes",
  storageBucket: "cosmica-clientes.firebasestorage.app",
  messagingSenderId: "875572379632",
  appId: "1:875572379632:web:db73498c6ffc9ec679a735"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);



// 🔍 AUTOCOMPLETAR CLIENTE
window.buscarCliente = async function() {
  const dni = document.getElementById("dni").value;

  if (!dni) return;

  const q = query(collection(db, "clientes"), where("dni", "==", dni));
  const snapshot = await getDocs(q);

  if (!snapshot.empty) {
    const data = snapshot.docs[0].data();

    document.getElementById("nombre").value = data.nombre || "";
    document.getElementById("apellido").value = data.apellido || "";
    document.getElementById("telefono").value = data.telefono || "";
    document.getElementById("provincia").value = data.provincia || "";
  } else {
    document.getElementById("nombre").value = "";
    document.getElementById("apellido").value = "";
    document.getElementById("telefono").value = "";
    document.getElementById("provincia").value = "";
  }
};



// 🚀 GUARDAR CLIENTE + TRABAJO
window.guardarCliente = async function() {
  const btn = document.getElementById("btnGuardar");

  try {
    btn.disabled = true;

const nombre = document.getElementById("nombre").value.trim();
const dni = document.getElementById("dni").value.trim();
const telefono = document.getElementById("telefono").value.trim();
const provincia = document.getElementById("provincia").value;
const equipo = document.getElementById("equipo").value.trim();
const problema = document.getElementById("problema").value.trim();

if (!nombre || !dni || !telefono || !provincia || !equipo || !problema) {
  alert("Completá todos los campos obligatorios");
  btn.disabled = false;
  return;
}
    let clienteId;

    // 🔍 buscar cliente existente
    const q = query(collection(db, "clientes"), where("dni", "==", dni));
    const snapshot = await getDocs(q);

    if (!snapshot.empty) {
      clienteId = snapshot.docs[0].id;
    } else {
      const clienteRef = await addDoc(collection(db, "clientes"), {
        nombre: nombre,
        apellido: document.getElementById("apellido").value,
        dni: dni,
        telefono: document.getElementById("telefono").value,
        provincia: document.getElementById("provincia").value,
        fechaAlta: new Date().toISOString()
      });

      clienteId = clienteRef.id;
    }

    // 🔧 crear trabajo
    await addDoc(collection(db, "trabajos"), {
      clienteId: clienteId,
      tipo: document.getElementById("tipo").value,
      equipo: document.getElementById("equipo").value,
      marca: document.getElementById("marca").value,
      modelo: document.getElementById("modelo").value,
      problema: document.getElementById("problema").value,
      estado: "Ingresado",
      fechaIngreso: new Date().toISOString(),
      garantiaDias: 90
    });

    alert("Ingreso guardado 😏");

    // limpiar formulario
    document.getElementById("nombre").value = "";
    document.getElementById("apellido").value = "";
    document.getElementById("dni").value = "";
    document.getElementById("telefono").value = "";
    document.getElementById("provincia").value = "";
    document.getElementById("equipo").value = "";
    document.getElementById("marca").value = "";
    document.getElementById("modelo").value = "";
    document.getElementById("problema").value = "";

    cargarTrabajos();

  } catch (e) {
    console.error(e);
    alert("Error al guardar");
  }

  btn.disabled = false;
};



// ⏳ GARANTÍA
function calcularGarantia(fechaIngreso, diasGarantia) {
  const inicio = new Date(fechaIngreso);
  const hoy = new Date();
  const diff = Math.floor((hoy - inicio) / (1000 * 60 * 60 * 24));
  return diasGarantia - diff;
}



// 🔄 CAMBIAR ESTADO
window.cambiarEstado = async function(id, nuevoEstado) {
  const ref = doc(db, "trabajos", id);

  const trabajosSnapshot = await getDocs(collection(db, "trabajos"));
  let estadoActual = "";

  trabajosSnapshot.forEach(docSnap => {
    if (docSnap.id === id) {
      estadoActual = docSnap.data().estado;
    }
  });

  if (estadoActual === "Entregado") {
    alert("Este trabajo ya fue entregado y no puede modificarse");
    return;
  }

  await updateDoc(ref, {
    estado: nuevoEstado
  });

  cargarTrabajos();
};



// 📋 CARGAR TRABAJOS
async function cargarTrabajos() {
  const contenedor = document.getElementById("listaTrabajos");
  contenedor.innerHTML = "";

  const trabajosSnapshot = await getDocs(collection(db, "trabajos"));
  const clientesSnapshot = await getDocs(collection(db, "clientes"));

  const clientes = {};
  clientesSnapshot.forEach(doc => {
    clientes[doc.id] = doc.data();
  });

  const trabajos = [];
  trabajosSnapshot.forEach(docSnap => trabajos.push(docSnap));

  trabajos.reverse().forEach(docSnap => {
    const id = docSnap.id;
    const trabajo = docSnap.data();
    const cliente = clientes[trabajo.clienteId];

    const dias = calcularGarantia(trabajo.fechaIngreso, trabajo.garantiaDias);
    const fecha = new Date(trabajo.fechaIngreso).toLocaleDateString();

    let color = "green";
    if (dias <= 0) color = "red";
    else if (dias <= 5) color = "orange";

    contenedor.innerHTML += `
      <div style="border:1px solid #ccc; padding:10px; margin:10px 0; background:#111; color:#eee;">
        <b>${cliente?.nombre || "?"} ${cliente?.apellido || ""}</b><br>
        DNI: ${cliente?.dni || "-"}<br>
        Ingreso: ${fecha}<br>
        Equipo: ${trabajo.equipo} (${trabajo.marca})<br>

        Estado: <b>${trabajo.estado}</b><br><br>

${trabajo.estado !== "Entregado" ? `
  <button onclick="cambiarEstado('${id}', 'En reparación')">Reparación</button>
  <button onclick="cambiarEstado('${id}', 'Listo')">Listo</button>
  <button onclick="cambiarEstado('${id}', 'Entregado')">Entregado</button>
` : `<b style="color:lime;">✔ Entregado</b>`}

        <br><br>

        <span style="color:${color}">
          Garantía: ${dias} días
        </span>
      </div>
    `;
  });
}

cargarTrabajos();

</script>

</body>
</html>
