<!DOCTYPE html>
<html>
<head>
  <title>Panel Cósmica</title>
</head>
<body>

<h2>Ingreso de trabajo</h2>

<input id="nombre" placeholder="Nombre"><br>
<input id="apellido" placeholder="Apellido"><br>
<input id="dni" placeholder="DNI"><br>
<input id="telefono" placeholder="Teléfono"><br>
<input id="provincia" placeholder="Provincia"><br><br>

<select id="tipo">
  <option value="taller">Taller</option>
  <option value="remoto">Remoto</option>
</select><br>

<input id="equipo" placeholder="Equipo (PC, notebook, impresora)"><br>
<input id="marca" placeholder="Marca"><br>
<input id="modelo" placeholder="Modelo"><br>
<input id="problema" placeholder="Problema"><br>

<button onclick="guardarTodo()">Guardar ingreso</button>

<h2>Trabajos registrados</h2>
<div id="listaTrabajos"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

// 🔑 TU CONFIG (ya la tenés, la dejo puesta)
const firebaseConfig = {
  apiKey: "AIzaSyBgRCLYvSPLG4PIqPjHFGsPhu0EoxTLKCU",
  authDomain: "cosmica-clientes.firebaseapp.com",
  projectId: "cosmica-clientes",
  storageBucket: "cosmica-clientes.firebasestorage.app",
  messagingSenderId: "875572379632",
  appId: "1:875572379632:web:db73498c6ffc9ec679a735"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🚀 guardar cliente
window.guardarCliente = async function() {
  try {
    await addDoc(collection(db, "clientes"), {
      nombre: document.getElementById("nombre").value,
      apellido: document.getElementById("apellido").value,
      dni: document.getElementById("dni").value,
      telefono: document.getElementById("telefono").value,
      fechaIngreso: new Date().toISOString(),
      garantiaDias: 90
    });

    alert("Cliente guardado 😏");
     // 🔥 ACTUALIZA LA LISTA AUTOMÁTICAMENTE
    cargarTrabajos();
  } catch (e) {
    console.error("Error:", e);
    alert("Error al guardar");
  }
}
import { getDocs } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

function calcularGarantia(fechaIngreso, diasGarantia) {
  const inicio = new Date(fechaIngreso);
  const hoy = new Date();
  const diff = Math.floor((hoy - inicio) / (1000 * 60 * 60 * 24));
  return diasGarantia - diff;
}

async function cargarClientes() {
  const contenedor = document.getElementById("lista");
  contenedor.innerHTML = "";

  const querySnapshot = await getDocs(collection(db, "clientes"));

  querySnapshot.forEach((doc) => {
    const data = doc.data();
    const dias = calcularGarantia(data.fechaIngreso, data.garantiaDias);

    let color = "green";
    if (dias <= 0) color = "red";
    else if (dias <= 5) color = "orange";

    contenedor.innerHTML += `
      <div style="margin-bottom:10px;">
        <b>${data.nombre} ${data.apellido}</b> | DNI: ${data.dni} <br>
        <span style="color:${color}">
          Garantía: ${dias} días
        </span>
      </div>
    `;
  });
}

// cargar al iniciar
cargarClientes();
import { getDocs } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
function calcularGarantia(fechaIngreso, diasGarantia) {
  const inicio = new Date(fechaIngreso);
  const hoy = new Date();

  const diff = Math.floor((hoy - inicio) / (1000 * 60 * 60 * 24));
  return diasGarantia - diff;
}
async function cargarTrabajos() {
  const contenedor = document.getElementById("listaTrabajos");
  contenedor.innerHTML = "";

  const trabajosSnapshot = await getDocs(collection(db, "trabajos"));
  const clientesSnapshot = await getDocs(collection(db, "clientes"));

  // mapear clientes
  const clientes = {};
  clientesSnapshot.forEach(doc => {
    clientes[doc.id] = doc.data();
  });

  trabajosSnapshot.forEach(doc => {
    const trabajo = doc.data();
    const cliente = clientes[trabajo.clienteId];

    const dias = calcularGarantia(trabajo.fechaIngreso, trabajo.garantiaDias);

    let color = "green";
    if (dias <= 0) color = "red";
    else if (dias <= 5) color = "orange";

    contenedor.innerHTML += `
      <div style="border:1px solid #ccc; padding:10px; margin:10px 0;">
        <b>${cliente?.nombre || "?"} ${cliente?.apellido || ""}</b><br>
        DNI: ${cliente?.dni || "-"}<br>
        Equipo: ${trabajo.equipo} (${trabajo.marca})<br>
        Estado: ${trabajo.estado}<br>
        <span style="color:${color}">
          Garantía: ${dias} días
        </span>
      </div>
    `;
  });
}
cargarTrabajos();
</script>

</body>
</html>
