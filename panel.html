<!DOCTYPE html>
<html>
<head>
  <title>Panel Cósmica</title>
</head>
<body>

<h2>Ingreso de trabajo</h2>
<p style="color:red;">* Campos obligatorios</p>

<label>Nombre *</label><br>
<input id="nombre"><br>

<label>Apellido</label><br>
<input id="apellido"><br>

<label>DNI *</label><br>
<input id="dni" onblur="buscarCliente()" oninput="this.value=this.value.replace(/[^0-9]/g,'')"><br>

<label>Teléfono *</label><br>
<input id="telefono" oninput="this.value=this.value.replace(/[^0-9]/g,'')"><br>

<label>Provincia *</label><br>
<select id="provincia">
<option value="">Seleccionar</option>
<option>Buenos Aires</option><option>CABA</option><option>Jujuy</option>
<option>Córdoba</option><option>Salta</option><option>Tucumán</option>
</select><br><br>

<label>Tipo de servicio *</label><br>
<select id="tipo">
  <option value="taller">Taller</option>
  <option value="remoto">Remoto</option>
</select><br><br>

<label>Equipo *</label><br>
<input id="equipo"><br>

<label>Marca</label><br>
<input id="marca"><br>

<label>Modelo</label><br>
<input id="modelo"><br>

<label>Problema *</label><br>
<textarea id="problema"></textarea><br>

<button onclick="guardarCliente()">Guardar</button>

<hr>

<h2>Buscar trabajos</h2>

<select id="filtroEstado" onchange="cargar()">
  <option value="">Todos los estados</option>
  <option value="Ingresado">Ingresado</option>
  <option value="En reparación">En reparación</option>
  <option value="Listo">Listo</option>
  <option value="Entregado">Entregado</option>
</select>

<input id="busquedaDni" placeholder="DNI o Nº de orden">
<button onclick="buscar()">Buscar</button>
<button onclick="cargar()">Ver todos</button>

<h2>Trabajos</h2>
<div id="listaTrabajos" style="color:gray;">
  🔍 Buscá un cliente o presioná "Ver todos"
</div>

<script type="module">
import { getFirestore, collection, addDoc, getDocs, getDoc, doc, query, where, updateDoc, deleteDoc } 
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";

const app = initializeApp({
  apiKey:"AIzaSy...",
  authDomain:"cosmica-clientes.firebaseapp.com",
  projectId:"cosmica-clientes"
});

const db = getFirestore(app);
let editandoTrabajoId = null;
let editandoClienteId = null;

// AUTOCOMPLETE
window.buscarCliente = async ()=>{
  const dniVal = dni.value;
  if(!dniVal) return;

  const q = query(collection(db,"clientes"), where("dni","==",dniVal));
  const snap = await getDocs(q);

  if(!snap.empty){
    const c = snap.docs[0].data();
    nombre.value=c.nombre||"";
    apellido.value=c.apellido||"";
    telefono.value=c.telefono||"";
    provincia.value=c.provincia||"";
  }
};

// GUARDAR
window.guardarCliente = async ()=>{
  const nombreVal = nombre.value.trim();
  const dniVal = dni.value.trim();
  const tel = telefono.value.trim();
  const prov = provincia.value;
  const eq = equipo.value.trim();
  const prob = problema.value.trim();
  const t = (await getDoc(doc(db,"trabajos",trabajoId))).data();
  const c = (await getDoc(doc(db,"clientes",clienteId))).data();

  nombre.value = c.nombre;
  apellido.value = c.apellido;
  dni.value = c.dni;
  telefono.value = c.telefono;
  provincia.value = c.provincia;

  document.getElementById("tipo").value = t.tipo;
  equipo.value = t.equipo;
  marca.value = t.marca;
  modelo.value = t.modelo;
  problema.value = t.problema;

  editandoTrabajoId = trabajoId;
  editandoClienteId = clienteId;

  alert("Modo edición activado ✏️");
};

  if(!nombreVal||!dniVal||!tel||!prov||!eq||!prob){
    alert("Faltan datos");
    return;
  }

  let clienteId;

  const q = query(collection(db,"clientes"), where("dni","==",dniVal));
  const snap = await getDocs(q);

  if(!snap.empty){
    clienteId = snap.docs[0].id;
  }else{
    const ref = await addDoc(collection(db,"clientes"),{
      nombre:nombreVal,
      apellido:apellido.value,
      dni:dniVal,
      telefono:tel,
      provincia:prov
    });
    clienteId = ref.id;
  }

  const tipo = document.getElementById("tipo").value;
  const prefijo = tipo === "remoto" ? "REM" : "TAL";

  const tSnap = await getDocs(collection(db,"trabajos"));

  let contador = 0;
  tSnap.forEach(docSnap=>{
    const t = docSnap.data();
    if (t.tipo === tipo) contador++;
  });

  const numero = contador + 1;
  const numeroOrden = prefijo + "-" + numero.toString().padStart(4, "0");

  if(editandoTrabajoId){
  await updateDoc(doc(db,"trabajos",editandoTrabajoId),{
    tipo,
    equipo:eq,
    marca:marca.value,
    modelo:modelo.value,
    problema:prob
  });

  await updateDoc(doc(db,"clientes",editandoClienteId),{
    nombre:nombreVal,
    apellido:apellido.value,
    telefono:tel,
    provincia:prov
  });

  editandoTrabajoId = null;
  editandoClienteId = null;

  alert("Orden actualizada correctamente");

}else{
  const tipo = document.getElementById("tipo").value;
  const prefijo = tipo === "remoto" ? "REM" : "TAL";

  const tSnap = await getDocs(collection(db,"trabajos"));

  let contador = 0;
  tSnap.forEach(docSnap=>{
    const t = docSnap.data();
    if (t.tipo === tipo) contador++;
  });

  const numero = contador + 1;
  const numeroOrden = prefijo + "-" + numero.toString().padStart(4, "0");

  await addDoc(collection(db,"trabajos"),{
    numeroOrden,
    clienteId,
    tipo,
    equipo:eq,
    marca:marca.value,
    modelo:modelo.value,
    problema:prob,
    estado:"Ingresado",
    fechaIngreso:new Date().toISOString(),
    garantiaDias:90
  });

  alert("Registro exitoso Rey, tu número de orden es: " + numeroOrden);
}
  document.querySelectorAll("input,textarea").forEach(e=>e.value="");
  provincia.value="";
};

// BUSCAR
window.editarTrabajo = async function(trabajoId, clienteId){
  const t = (await getDoc(doc(db,"trabajos",trabajoId))).data();
  const c = (await getDoc(doc(db,"clientes",clienteId))).data();

  nombre.value = c.nombre;
  apellido.value = c.apellido;
  dni.value = c.dni;
  telefono.value = c.telefono;
  provincia.value = c.provincia;

  document.getElementById("tipo").value = t.tipo;
  equipo.value = t.equipo;
  marca.value = t.marca;
  modelo.value = t.modelo;
  problema.value = t.problema;

  editandoTrabajoId = trabajoId;
  editandoClienteId = clienteId;

  alert("Modo edición activado ✏️");
};
window.buscar = ()=>{
  const valor = document.getElementById("busquedaDni").value.trim();
  if(!valor){
    alert("Ingresá DNI o Nº de orden");
    return;
  }
  cargar(valor);
};

// LISTA
window.cargar = async function(filtro=""){
  const cont = listaTrabajos;
  cont.innerHTML="";

  const estadoFiltro = document.getElementById("filtroEstado").value;

  const tSnap = await getDocs(collection(db,"trabajos"));
  const cSnap = await getDocs(collection(db,"clientes"));

  const clientes={};
  cSnap.forEach(d=>clientes[d.id]=d.data());

  tSnap.forEach(docSnap=>{
    const t=docSnap.data();
    const c=clientes[t.clienteId];

    if(filtro){
      const okDni = c?.dni === filtro;
      const okOrden = t.numeroOrden === filtro;
      if(!okDni && !okOrden) return;
    }

    if(estadoFiltro && t.estado !== estadoFiltro) return;

    cont.innerHTML+=`
    <div style="background:#111;color:#fff;padding:10px;margin:10px;border:1px solid #333">
      <b>${c?.nombre} ${c?.apellido}</b><br>
      DNI: ${c?.dni}<br>
      Orden: ${t.numeroOrden}<br>
      Tipo: ${t.tipo}<br>
      Equipo: ${t.equipo}<br>

      Estado: ${t.estado}<br>

      Ingreso: ${t.fechaIngreso ? new Date(t.fechaIngreso).toLocaleString("es-AR") : "-"}<br>
      Reparado: ${t.fechaReparado ? new Date(t.fechaReparado).toLocaleString("es-AR") : "-"}<br>
      Entregado: ${t.fechaEntregado ? new Date(t.fechaEntregado).toLocaleString("es-AR") : "-"}<br>

      Problema: ${t.problema}<br>
      Marca: ${t.marca || "-"}<br>
      Modelo: ${t.modelo || "-"}<br>

      <button onclick="cambiarEstado('${docSnap.id}','En reparación')">Reparación</button>
      <button onclick="cambiarEstado('${docSnap.id}','Listo')">Listo</button>
      <button onclick="cambiarEstado('${docSnap.id}','Entregado')">Entregado</button>
      <button onclick="editarTrabajo('${docSnap.id}','${t.clienteId}')">Editar</button>
      <button onclick="borrarTrabajo('${docSnap.id}')" style="background:red;color:white;">Borrar</button>
      <button onclick="imprimirTicket('${docSnap.id}')">Ticket</button>
    </div>`;
  });
};

// ESTADO
window.cambiarEstado = async(id,e)=>{
  const ref = doc(db,"trabajos",id);
  const snap = await getDoc(ref);

  if(snap.data().estado === "Entregado") return;

  let update = { estado: e };
  const ahora = new Date().toISOString();

  if(e === "Listo") update.fechaReparado = ahora;
  if(e === "Entregado") update.fechaEntregado = ahora;

  await updateDoc(ref, update);
  cargar();
};

// BORRAR
window.borrarTrabajo = async(id)=>{
  if(!confirm("Eliminar?")) return;
  await deleteDoc(doc(db,"trabajos",id));
  cargar();
};

// TICKET + QR
window.imprimirTicket = async function(id){
  const t = (await getDoc(doc(db,"trabajos",id))).data();
  const cSnap = await getDocs(collection(db,"clientes"));

  let cliente = {};
  cSnap.forEach(d=>{
    if(d.id === t.clienteId) cliente = d.data();
  });

  const url = encodeURIComponent(window.location.origin + "/panel.html?orden=" + t.numeroOrden);

  const v = window.open("", "_blank");

  v.document.write(`
    <html>
    <body style="font-family:Arial">

      <h2 style="text-align:center;">Órden de trabajo</h2>

      <div style="text-align:center">
        <b>${t.numeroOrden}</b><br><br>
        <img id="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${url}">
      </div>

      <br>

      Cliente: ${cliente.nombre} ${cliente.apellido}<br>
      DNI: ${cliente.dni}<br><br>

      Tipo: ${t.tipo}<br>
      Equipo: ${t.equipo}<br>
      Marca: ${t.marca}<br>
      Modelo: ${t.modelo}<br><br>

      Problema:<br>${t.problema}<br><br>

      Estado: ${t.estado}<br>

      Ingreso: ${t.fechaIngreso ? new Date(t.fechaIngreso).toLocaleString("es-AR") : "-"}<br>
      Reparado: ${t.fechaReparado ? new Date(t.fechaReparado).toLocaleString("es-AR") : "-"}<br>
      Entregado: ${t.fechaEntregado ? new Date(t.fechaEntregado).toLocaleString("es-AR") : "-"}<br>

      <script>
        document.getElementById("qr").onload = () => window.print();
      <\/script>

    </body>
    </html>
  `);

  v.document.close();
};
</script>

</body>
</html>
