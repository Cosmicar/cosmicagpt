<!DOCTYPE html>
<html>
<head>
  <title>Panel Cósmica</title>
</head>
<body>

<h2>Ingreso de trabajo</h2>

<input id="nombre" placeholder="Nombre"><br>
<input id="apellido" placeholder="Apellido"><br>
<input id="dni" placeholder="DNI"><br>
<input id="telefono" placeholder="Teléfono"><br>
<input id="provincia" placeholder="Provincia"><br><br>

<select id="tipo">
  <option value="taller">Taller</option>
  <option value="remoto">Remoto</option>
</select><br>

<input id="equipo" placeholder="Equipo (PC, notebook, impresora)"><br>
<input id="marca" placeholder="Marca"><br>
<input id="modelo" placeholder="Modelo"><br>
<textarea id="problema" placeholder="Descripción del problema"></textarea><br>

<button id="btnGuardar" onclick="guardarCliente()">Guardar ingreso</button>

<h2>Trabajos registrados</h2>
<div id="listaTrabajos"></div>

<script type="module">
import { 
  getFirestore, 
  collection, 
  addDoc, 
  getDocs, 
  doc, 
  query,
  where,
  updateDoc 
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
// 🔑 TU CONFIG (ya la tenés, la dejo puesta)
const firebaseConfig = {
  apiKey: "AIzaSyBgRCLYvSPLG4PIqPjHFGsPhu0EoxTLKCU",
  authDomain: "cosmica-clientes.firebaseapp.com",
  projectId: "cosmica-clientes",
  storageBucket: "cosmica-clientes.firebasestorage.app",
  messagingSenderId: "875572379632",
  appId: "1:875572379632:web:db73498c6ffc9ec679a735"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🚀 guardar cliente
window.guardarCliente = async function() {
  try {
// No guarar con campos vacios
const nombre = document.getElementById("nombre").value.trim();
const dni = document.getElementById("dni").value.trim();

if (!nombre || !dni) {
  alert("Completá al menos Nombre y DNI");
  return;
}
const btn = document.getElementById("btnGuardar");
btn.disabled = true;

try {
  // ... tu lógica
} finally {
  btn.disabled = false;
}
// 🔍 manejar cliente sin duplicados
const dni = document.getElementById("dni").value;

let clienteId;

// buscar cliente existente
const q = query(collection(db, "clientes"), where("dni", "==", dni));
const snapshot = await getDocs(q);

if (!snapshot.empty) {
  // ya existe → usarlo
  clienteId = snapshot.docs[0].id;
} else {
  // no existe → crear nuevo
  const clienteRef = await addDoc(collection(db, "clientes"), {
    nombre: document.getElementById("nombre").value,
    apellido: document.getElementById("apellido").value,
    dni: dni,
    telefono: document.getElementById("telefono").value,
    provincia: document.getElementById("provincia").value,
    fechaAlta: new Date().toISOString()
  });

  clienteId = clienteRef.id;
}
    // 2 crear trabajo
    await addDoc(collection(db, "trabajos"), {
      clienteId: clienteId,
      tipo: document.getElementById("tipo").value,
      equipo: document.getElementById("equipo").value,
      marca: document.getElementById("marca").value,
      modelo: document.getElementById("modelo").value,
      problema: document.getElementById("problema").value,
      estado: "Ingresado",
      fechaIngreso: new Date().toISOString(),
      garantiaDias: 90
    });

    alert("Ingreso guardado 😏");
    // limpiar formulario
document.getElementById("nombre").value = "";
document.getElementById("apellido").value = "";
document.getElementById("dni").value = "";
document.getElementById("telefono").value = "";
document.getElementById("provincia").value = "";
document.getElementById("equipo").value = "";
document.getElementById("marca").value = "";
document.getElementById("modelo").value = "";
document.getElementById("problema").value = "";

cargarTrabajos();

  } catch (e) {
    console.error(e);
    alert("Error al guardar");
  }
}

function calcularGarantia(fechaIngreso, diasGarantia) {
  const inicio = new Date(fechaIngreso);
  const hoy = new Date();
  const diff = Math.floor((hoy - inicio) / (1000 * 60 * 60 * 24));
  return diasGarantia - diff;
}
//funcion cambiar estado
window.cambiarEstado = async function(id, nuevoEstado) {
  const ref = doc(db, "trabajos", id);

  await updateDoc(ref, {
    estado: nuevoEstado
  });

  cargarTrabajos();
}
// cargar al iniciar
async function cargarTrabajos() {
  const contenedor = document.getElementById("listaTrabajos");
  contenedor.innerHTML = "";

  const trabajosSnapshot = await getDocs(collection(db, "trabajos"));
  const clientesSnapshot = await getDocs(collection(db, "clientes"));

  // mapear clientes
  const clientes = {};
  clientesSnapshot.forEach(doc => {
    clientes[doc.id] = doc.data();
  });

  const trabajos = [];
trabajosSnapshot.forEach(docSnap => trabajos.push(docSnap));

trabajos.reverse().forEach(docSnap => {
  const id = docSnap.id;
  const trabajo = docSnap.data();
  const cliente = clientes[trabajo.clienteId];

    const dias = calcularGarantia(trabajo.fechaIngreso, trabajo.garantiaDias);

    let color = "green";
    if (dias <= 0) color = "red";
    else if (dias <= 5) color = "orange";
const fecha = new Date(trabajo.fechaIngreso).toLocaleDateString();
contenedor.innerHTML += `
  <div style="border:1px solid #ccc; padding:10px; margin:10px 0;">
    <b>${cliente?.nombre || "?"} ${cliente?.apellido || ""}</b><br>
    DNI: ${cliente?.dni || "-"}<br>
    Equipo: ${trabajo.equipo} (${trabajo.marca})<br>

    Estado: <b>${trabajo.estado}</b><br><br>

    <button onclick="cambiarEstado('${id}', 'En reparación')">Reparación</button>
    <button onclick="cambiarEstado('${id}', 'Listo')">Listo</button>
    <button onclick="cambiarEstado('${id}', 'Entregado')">Entregado</button>

    <br><br>

    <span style="color:${color}">
      Garantía: ${dias} días
    </span>
  </div>
`;
  });
}
cargarTrabajos();

</script>

</body>
</html>
