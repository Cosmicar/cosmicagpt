<!DOCTYPE html>
<html>
<head>
  <title>Panel Cósmica</title>
</head>
<body>
<div style="background:#111;color:#fff;padding:10px;">
  👤 <span id="usuarioLogueado">Cargando...</span>
  <button onclick="logout()" style="float:right;">Cerrar sesión</button>
</div>
<!-- Crear usuario deshabilitado en panel -->
<h2>Ingreso de trabajo</h2>
<p style="color:red;">* Campos obligatorios</p>

<label>Nombre *</label><br>
<input id="nombre"><br>

<label>Apellido</label><br>
<input id="apellido"><br>

<label>DNI *</label><br>
<input id="dni" onblur="buscarCliente()" oninput="this.value=this.value.replace(/[^0-9]/g,'')"><br>

<label>Teléfono *</label><br>
<input id="telefono" oninput="this.value=this.value.replace(/[^0-9]/g,'')"><br>

<label>Provincia *</label><br>
<select id="provincia">
<option value="">Seleccionar</option>
<option>Buenos Aires</option><option>CABA</option><option>Jujuy</option>
<option>Córdoba</option><option>Salta</option><option>Tucumán</option>
</select><br><br>

<label>Tipo de servicio *</label><br>
<select id="tipo">
  <option value="taller">Taller</option>
  <option value="remoto">Remoto</option>
</select><br><br>

<label>Equipo *</label><br>
<input id="equipo"><br>

<label>Marca</label><br>
<input id="marca"><br>

<label>Modelo</label><br>
<input id="modelo"><br>

<label>Problema *</label><br>
<textarea id="problema"></textarea><br>
<label>Precio ($) *</label><br>
<input id="precio" type="number"><br>

<button onclick="guardarCliente()">Guardar</button>

<hr>

<h2>Buscar trabajos</h2>

<select id="filtroEstado" onchange="cargar()">
  <option value="">Todos los estados</option>
  <option value="Ingresado">Ingresado</option>
  <option value="En reparación">En reparación</option>
  <option value="Listo">Listo</option>
  <option value="Entregado">Entregado</option>
</select>

<input id="busquedaDni" placeholder="DNI o Nº de orden" onkeydown="if(event.key==='Enter'){buscar()}">
<button onclick="buscar()">Buscar</button>
<button onclick="cargar()">Ver todos</button>

<h2>Trabajos</h2>
<h3>Total del día: $<span id="totalDia">0</span></h3>
<h3>Total del mes: $<span id="totalMes">0</span></h3>
<div id="listaTrabajos" style="color:gray;">
  🔍 Buscá un cliente o presioná "Ver todos"
</div>

<script type="module">
import { getFirestore, collection, addDoc, getDocs, getDoc, doc, query, where, updateDoc, deleteDoc } 
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgRCLYvSPLG4PIqPjHFGsPhu0EoxTLKCU",
  authDomain: "cosmica-clientes.firebaseapp.com",
  projectId: "cosmica-clientes",
  storageBucket: "cosmica-clientes.appspot.com",
  messagingSenderId: "875572379632",
  appId: "1:875572379632:web:db73498c6ffc9ec679a735"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);
const auth = getAuth(app);

// 🔐 PROTECCIÓN

onAuthStateChanged(auth, user=>{
  if(user){
    document.getElementById("usuarioLogueado").innerText = user.email;
  } else {
    window.location.href = "login.html";
  }
});
window.logout = async ()=>{
  await signOut(auth);
  window.location.href = "login.html";
};
window.crearUsuario = async ()=>{
  const email = document.getElementById("newEmail").value;
  const pass = document.getElementById("newPass").value;

  if(!email || !pass){
    alert("Completá los datos");
    return;
  }

  const usuarioActual = auth.currentUser;

  try{
    // crea usuario (te cambia de sesión)
    await createUserWithEmailAndPassword(auth, email, pass);

    alert("Usuario creado correctamente");

    // 🔥 volver al usuario original
    await signOut(auth);

    await signInWithEmailAndPassword(auth, usuarioActual.email, prompt("Reingresá tu contraseña admin"));

  }catch(e){
    alert("Error: " + e.message);
  }
};
function diasRestantes(fecha, dias){
  if(!fecha) return 0;
  const inicio = new Date(fecha);
  const hoy = new Date();
  const diff = Math.floor((hoy - inicio) / 86400000);
  return dias - diff;
}

let editandoTrabajoId = null;
let editandoClienteId = null;

// AUTOCOMPLETE
window.buscarCliente = async ()=>{
  const dniVal = dni.value;
  if(!dniVal) return;

  const q = query(collection(db,"clientes"), where("dni","==",dniVal));
  const snap = await getDocs(q);

  if(!snap.empty){
    const c = snap.docs[0].data();
    nombre.value=c.nombre||"";
    apellido.value=c.apellido||"";
    telefono.value=c.telefono||"";
    provincia.value=c.provincia||"";
  }
};

// EDITAR
window.editarTrabajo = async function(trabajoId, clienteId){
  const t = (await getDoc(doc(db,"trabajos",trabajoId))).data();
  const c = (await getDoc(doc(db,"clientes",clienteId))).data();

  nombre.value = c.nombre;
  apellido.value = c.apellido;
  dni.value = c.dni;
  telefono.value = c.telefono;
  provincia.value = c.provincia;

  document.getElementById("tipo").value = t.tipo;
  equipo.value = t.equipo;
  marca.value = t.marca;
  modelo.value = t.modelo;
  problema.value = t.problema;

  editandoTrabajoId = trabajoId;
  editandoClienteId = clienteId;

  alert("Modo edición activado ✏️");
};

// GUARDAR
window.guardarCliente = async ()=>{
  const nombreVal = nombre.value.trim();
  const dniVal = dni.value.trim();
  const tel = telefono.value.trim();
  const prov = provincia.value;
  const eq = equipo.value.trim();
  const prob = problema.value.trim();
  const precioVal = parseFloat(document.getElementById("precio").value);

  if(!nombreVal||!dniVal||!tel||!prov||!eq||!prob||isNaN(precioVal)){
    alert("Faltan datos");
    return;
  }

  let clienteId;

  const q = query(collection(db,"clientes"), where("dni","==",dniVal));
  const snap = await getDocs(q);

  if(!snap.empty){
    clienteId = snap.docs[0].id;
  }else{
    const ref = await addDoc(collection(db,"clientes"),{
      nombre:nombreVal,
      apellido:apellido.value,
      dni:dniVal,
      telefono:tel,
      provincia:prov
    });
    clienteId = ref.id;
  }

  const tipo = document.getElementById("tipo").value;
  const prefijo = tipo === "remoto" ? "REM" : "TAL";

  if(editandoTrabajoId){

    await updateDoc(doc(db,"trabajos",editandoTrabajoId),{
      tipo,
      equipo:eq,
      marca:marca.value,
      modelo:modelo.value,
      problema:prob
    });

    await updateDoc(doc(db,"clientes",editandoClienteId),{
      nombre:nombreVal,
      apellido:apellido.value,
      telefono:tel,
      provincia:prov
    });

    editandoTrabajoId = null;
    editandoClienteId = null;

    alert("Orden actualizada correctamente");

  }else{

    const tSnap = await getDocs(collection(db,"trabajos"));
    let contador = 0;

 tSnap.forEach(docSnap=>{
  const t = docSnap.data();
  if (t.tipo === tipo) contador++;
});

    const numero = contador + 1;
    const numeroOrden = prefijo + "-" + numero.toString().padStart(4, "0");

    await addDoc(collection(db,"trabajos"),{
      numeroOrden,
      clienteId,
      tipo,
      equipo:eq,
      marca:marca.value,
      modelo:modelo.value,
      problema:prob,
      precio: precioVal,
      estado:"Ingresado",
      fechaIngreso:new Date().toISOString(),
      garantiaDias:90
    });

    alert("Registro exitoso Rey, tu número de orden es: " + numeroOrden);
  }

  document.querySelectorAll("input,textarea").forEach(e=>e.value="");
  provincia.value="";
};

// BUSCAR
window.buscar = ()=>{
  const valor = document.getElementById("busquedaDni").value.trim();

  if(!valor){
    return; // 🔥 no hace nada (silencioso)
  }

  cargar(valor);
};

// LISTA
window.cargar = async function(filtro=""){
  const cont = listaTrabajos;
  cont.innerHTML="";
  let totalDia = 0;
const hoy = new Date().toISOString().split("T")[0];
let totalMes = 0;
const mesActual = new Date().toISOString().slice(0,7);
  let resultados = [];
  const estadoFiltro = document.getElementById("filtroEstado").value;

  const tSnap = await getDocs(collection(db,"trabajos"));
  const cSnap = await getDocs(collection(db,"clientes"));

  const clientes={};
  cSnap.forEach(d=>clientes[d.id]=d.data());

  tSnap.forEach(docSnap=>{
    const t=docSnap.data();
if(t.estado === "Entregado" && t.fechaIngreso && t.fechaIngreso.startsWith(hoy)){
  totalDia += Number(t.precio || 0);
}

if(t.estado === "Entregado" && t.fechaIngreso && t.fechaIngreso.startsWith(mesActual)){
  totalMes += Number(t.precio || 0);
}
    const c=clientes[t.clienteId];

    if(filtro){
      const okDni = c?.dni === filtro;
      const okOrden = t.numeroOrden === filtro;
      if(!okDni && !okOrden) return;
    }

  if(estadoFiltro && t.estado !== estadoFiltro) return;

resultados.push({docSnap,t,c});
   cont.innerHTML+=`
<div class="card-trabajo" style="background:#111;color:#fff;padding:15px;margin:15px;border-radius:10px;border:1px solid #333">

  <div style="font-size:18px;font-weight:bold;margin-bottom:5px;">
    ${c?.nombre} ${c?.apellido}
  </div>

  <div style="font-size:13px;color:#ccc;margin-bottom:10px;">
    DNI: ${c?.dni} | Orden: ${t.numeroOrden}
  </div>

  <div style="margin-bottom:10px;">
    <b>Equipo:</b> ${t.equipo} (${t.tipo})<br>
    <b>Marca:</b> ${t.marca || "-"} | <b>Modelo:</b> ${t.modelo || "-"}
  </div>

  <div style="margin-bottom:10px;">
<b>Problema:</b><br>
${t.problema}

<br><br><b>Precio:</b> $${t.precio || 0}
  </div>

  <div style="margin-bottom:10px;">
    <b>Estado:</b> ${t.estado}<br>

    ${t.estado === "Entregado" ? `
      <b>Garantía:</b> ${
        diasRestantes(t.fechaEntregado, t.garantiaDias) > 0
        ? diasRestantes(t.fechaEntregado, t.garantiaDias) + " días restantes"
        : "Vencida"
      }
    ` : ""}
  </div>

  <div style="font-size:12px;color:#aaa;margin-bottom:10px;">
    Ingreso: ${t.fechaIngreso ? new Date(t.fechaIngreso).toLocaleString("es-AR") : "-"}<br>
    Reparado: ${t.fechaReparado ? new Date(t.fechaReparado).toLocaleString("es-AR") : "-"}<br>
    Entregado: ${t.fechaEntregado ? new Date(t.fechaEntregado).toLocaleString("es-AR") : "-"}
  </div>

<div style="margin-top:10px;">

  ${
    t.estado !== "Entregado"
    ? `
      <button onclick="cambiarEstado('${docSnap.id}','En reparación')">Reparación</button>
      <button onclick="cambiarEstado('${docSnap.id}','Listo')">Listo</button>
      <button onclick="cambiarEstado('${docSnap.id}','Entregado')">Entregado</button>
      <button onclick="editarTrabajo('${docSnap.id}','${t.clienteId}')">Editar</button>
      <button onclick="borrarTrabajo('${docSnap.id}')" style="background:red;color:white;">Borrar</button>
      <button onclick="imprimirTicket('${docSnap.id}')">Ticket</button>
    `
    : `
      <button onclick="reingresarTrabajo('${docSnap.id}')">Reingreso</button>
    `
  }

</div>

</div>`;
  });
  // 🔥 destacar si hay un solo resultado
if(resultados.length === 1){
  const cards = document.querySelectorAll(".card-trabajo");
const card = cards[0];

  if(card){
    card.style.border = "2px solid #00ffcc";
    card.style.boxShadow = "0 0 10px #00ffcc";

    // 🔥 scroll automático
    card.scrollIntoView({behavior:"smooth", block:"center"});
  }
}
document.getElementById("totalDia").innerText = totalDia;
document.getElementById("totalMes").innerText = totalMes;
};

// ESTADO
window.cambiarEstado = async(id,e)=>{
    const ref = doc(db,"trabajos",id);
  const snap = await getDoc(ref);

  if(snap.data().estado === "Entregado") return;

  let update = { estado: e };
  const ahora = new Date().toISOString();

  if(e === "Listo") update.fechaReparado = ahora;
  if(e === "Entregado") update.fechaEntregado = ahora;

  await updateDoc(ref, update);
  cargar();
};
window.reingresarTrabajo = async function(id){

  try{

    const ref = doc(db,"trabajos",id);

    // 🔥 SOLO CAMBIAMOS ESTADO
    await updateDoc(ref,{
      estado: "En reparación"
    });

    alert("Equipo reingresado correctamente 🔧");

    cargar();

  }catch(e){
    console.error(e);
    alert("Error al reingresar: " + e.message);
  }
};

// BORRAR
window.borrarTrabajo = async(id)=>{
  if(!confirm("Eliminar?")) return;
  await deleteDoc(doc(db,"trabajos",id));
  cargar();
};

// TICKET + QR
window.imprimirTicket = async function(id){
  const t = (await getDoc(doc(db,"trabajos",id))).data();
  const cSnap = await getDocs(collection(db,"clientes"));

  let cliente = {};
  cSnap.forEach(d=>{
    if(d.id === t.clienteId) cliente = d.data();
  });

  const url = encodeURIComponent(window.location.origin + "/panel.html?orden=" + t.numeroOrden);

  const v = window.open("", "_blank");

  v.document.write(`
    <html>
    <body style="font-family:Arial">

      <h2 style="text-align:center;">Órden de trabajo</h2>

      <div style="text-align:center">
        <b>${t.numeroOrden}</b><br><br>
        <img id="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${url}">
      </div>

      <br>

      Cliente: ${cliente.nombre} ${cliente.apellido}<br>
      DNI: ${cliente.dni}<br><br>

      Tipo: ${t.tipo}<br>
      Equipo: ${t.equipo}<br>
      Marca: ${t.marca}<br>
      Modelo: ${t.modelo}<br><br>

      Problema:<br>${t.problema}<br><br>

      Estado: ${t.estado}<br>

      Ingreso: ${t.fechaIngreso ? new Date(t.fechaIngreso).toLocaleString("es-AR") : "-"}<br>
      Reparado: ${t.fechaReparado ? new Date(t.fechaReparado).toLocaleString("es-AR") : "-"}<br>
      Entregado: ${t.fechaEntregado ? new Date(t.fechaEntregado).toLocaleString("es-AR") : "-"}<br>

      <script>
        document.getElementById("qr").onload = () => window.print();
      <\/script>

    </body>
    </html>
  `);

  v.document.close();
};
</script>

</body>
</html>
