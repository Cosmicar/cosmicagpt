<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Cosmica.ar</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #050B14;
      --surface: rgba(15, 23, 42, 0.6);
      --card:    rgba(255, 255, 255, 0.02);
      --border:  rgba(255, 255, 255, 0.08);
      --accent:  #FF5E00; /* Vibrant Orange */
      --accent2: #00E5FF; /* Electric Blue */
      --danger:  #FF007F; /* Magenta */
      --warning: #F59E0B;
      --success: #10B981;
      --purple:  #8B5CF6;
      --text:    #F8FAFC;
      --muted:   #94A3B8;
      --radius-pill: 50px;
      --radius-card: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background:
        radial-gradient(circle at 20% -10%, rgba(0,229,255,0.15), transparent 40%),
        radial-gradient(circle at 80% 40%, rgba(255,0,127,0.10), transparent 40%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Inter', 'DM Sans', sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .header {
      background: rgba(5,11,20,0.8);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky; top: 0; z-index: 200;
    }
    .logo {
      font-family: 'Inter', sans-serif;
      font-size: 20px; font-weight: 700;
      letter-spacing: -0.5px; color: var(--accent2);
      display: flex; align-items: center; gap: 10px;
    }
    .logo img {
      width: 30px; height: 30px;
      object-fit: contain;
      display: block;

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <img src="cosmica-logo.png" alt="Cosmica.ar">
    <span>Cosmica.ar</span>
  </div>
  <div class="header-right">
    <div class="user-tag">👤 <b id="usuarioLogueado">…</b></div>
    <button class="btn-logout" onclick="logout()">Salir</button>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active"     onclick="showTab('trabajos')">🛠️ Trabajos</div>
  <div class="tab"            onclick="showTab('nuevo')">➕ Nuevo ingreso</div>
  <div class="tab"            onclick="showTab('ingresos'); cargarIngresos()">💰 Ingresos</div>
  <div class="tab admin-section" id="tabAdmin" onclick="showTab('admin')">⚙️ Admin</div>
</div>

<div class="container">

  <!-- ══════════════════════════════════════════ TAB: TRABAJOS -->
  <div class="tab-content active" id="tab-trabajos">
    <div class="totales">
      <div class="total-card">
        <div class="label">Entregado hoy</div>
        <div class="value">$<span id="totalDia">0</span></div>
      </div>
      <div class="total-card">
        <div class="label">Entregado este mes</div>
        <div class="value">$<span id="totalMes">0</span></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">🔍 Buscar trabajos</div>
      <div class="search-bar">
        <select id="filtroEstado" onchange="cargar(document.getElementById('busquedaDni').value.trim(), { fromFilter: true })">
          <option value="">Todos los estados</option>
          <option value="Ingresado">Ingresado</option>
          <option value="En reparación">En reparación</option>
          <option value="Listo">Listo</option>
          <option value="Entregado">Entregado</option>
          <option value="Reingresada">Reingresada</option>
        </select>
        <input id="busquedaDni" placeholder="DNI o Nº de orden…"
          onkeydown="if(event.key==='Enter') buscar()">
        <button class="btn btn-sm btn-secondary" onclick="buscar()">Buscar</button>
        <button class="btn btn-sm btn-edit" onclick="limpiarBusqueda()">Ver todos</button>
      </div>
      <div id="listaTrabajos" class="empty-state">
        🔍 Buscá un cliente o presioná "Ver todos"
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════ TAB: NUEVO -->
  <div class="tab-content" id="tab-nuevo">
    <div class="section">
      <div class="section-title">📋 Ingreso de trabajo</div>
      <div id="modoEdicionBanner" class="modo-edicion">
        ✏️ Modo edición activo — Modificá los datos y guardá
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Nombre <span class="req">*</span></label>
          <input id="nombre" placeholder="Juan">
        </div>
        <div class="form-group">
          <label>Apellido</label>
          <input id="apellido" placeholder="Pérez">
        </div>
        <div class="form-group">
          <label>DNI <span class="req">*</span></label>
          <input id="dni" placeholder="12345678"
            onblur="buscarClienteAutofill()"
            oninput="this.value=this.value.replace(/[^0-9]/g,'')">
        </div>
        <div class="form-group">
          <label>Teléfono <span class="req">*</span></label>
          <input id="telefono" placeholder="3883000000"
            oninput="this.value=this.value.replace(/[^0-9]/g,'')">
        </div>
        <div class="form-group">
          <label>Provincia <span class="req">*</span></label>
          <select id="provincia">
            <option value="">Seleccionar…</option>
            <option>Buenos Aires</option><option>CABA</option><option>Jujuy</option>
            <option>Córdoba</option><option>Salta</option><option>Tucumán</option>
            <option>Mendoza</option><option>Santa Fe</option><option>Entre Ríos</option>
            <option>Misiones</option><option>Chaco</option><option>Formosa</option>
            <option>Santiago del Estero</option><option>Catamarca</option>
            <option>La Rioja</option><option>San Juan</option><option>San Luis</option>
            <option>Neuquén</option><option>Río Negro</option><option>Chubut</option>
            <option>Santa Cruz</option><option>Tierra del Fuego</option>
            <option>La Pampa</option><option>Corrientes</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tipo de servicio <span class="req">*</span></label>
          <select id="tipo">
            <option value="taller">Taller</option>
            <option value="remoto">Remoto</option>
          </select>
        </div>
        <div class="form-group">
          <label>Equipo <span class="req">*</span></label>
          <input id="equipo" placeholder="Notebook, PC, Impresora…">
        </div>
        <div class="form-group">
          <label>Marca</label>
          <input id="marca" placeholder="HP, Epson, Lenovo…">
        </div>
        <div class="form-group">
          <label>Modelo</label>
          <input id="modelo" placeholder="14-ep2013wm…">
        </div>
        <div class="form-group">
          <label>Precio ($) <span class="req">*</span></label>
          <input id="precio" type="number" min="0" placeholder="0">
        </div>
        <div class="form-group full">
          <label>Problema <span class="req">*</span></label>
          <textarea id="problema" placeholder="Describí el problema del equipo…"></textarea>
        </div>
      </div>

      <div style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="guardarCliente()">💾 Guardar</button>
        <button class="btn btn-edit" id="btnCancelar"
          style="display:none" onclick="cancelarEdicion()">✕ Cancelar edición</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════ TAB: INGRESOS -->
  <div class="tab-content" id="tab-ingresos">
    <div class="section">
      <div class="section-title">💰 Gestión de ingresos</div>

      <!-- Filtros de período -->
      <div class="ingresos-filtros">
        <button class="period-btn active" onclick="setPeriodo('hoy', this)">Hoy</button>
        <button class="period-btn" onclick="setPeriodo('semana', this)">Esta semana</button>
        <button class="period-btn" onclick="setPeriodo('mes', this)">Este mes</button>
        <button class="period-btn" onclick="setPeriodo('mes_anterior', this)">Mes anterior</button>
        <button class="period-btn" onclick="setPeriodo('custom', this)">Personalizado</button>
      </div>

      <div class="fecha-custom" id="fechaCustom" style="display:none; margin-bottom:16px;">
        <input type="date" id="fechaDesde" onchange="cargarIngresos()">
        <span style="color:var(--muted)">→</span>
        <input type="date" id="fechaHasta" onchange="cargarIngresos()">
      </div>

      <!-- KPIs -->
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-label">Total período</div>
          <div class="kpi-value" id="kpiTotal">$0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Taller</div>
          <div class="kpi-value blue" id="kpiTaller">$0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Remoto</div>
          <div class="kpi-value green" id="kpiRemoto">$0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Órdenes</div>
          <div class="kpi-value white" id="kpiOrdenes">0</div>
        </div>
      </div>

      <!-- Tabla detalle -->
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <span style="font-size:13px; color:var(--muted);">Detalle de entregas</span>
        <button class="btn-csv" onclick="exportarCSV()">⬇️ Exportar CSV</button>
      </div>
      <div style="overflow-x:auto;">
        <table class="ingresos-tabla">
          <thead>
            <tr>
              <th>Orden</th>
              <th>Cliente</th>
              <th>Equipo</th>
              <th>Tipo</th>
              <th>Fecha entrega</th>
              <th>Monto</th>
            </tr>
          </thead>
          <tbody id="ingresosTablaBody">
            <tr><td colspan="6" style="text-align:center;color:var(--muted);padding:30px;">
              Seleccioná un período para ver el detalle
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════ TAB: ADMIN -->
  <div class="tab-content admin-section" id="tab-admin">
    <div class="section">
      <div class="section-title">⚙️ Crear usuario operador</div>
      <p style="color:var(--muted);font-size:13px;margin-bottom:20px;">
        Los usuarios creados aquí tendrán rol <b style="color:var(--accent2)">operador</b> —
        pueden gestionar trabajos, pero no borrar órdenes ni acceder a esta sección.
      </p>
      <div class="form-grid">
        <div class="form-group">
          <label>Email del nuevo usuario</label>
          <input id="newEmail" type="email" placeholder="operador@cosmica.ar">
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input id="newPass" type="password" placeholder="Mínimo 6 caracteres">
        </div>
      </div>
      <div style="margin-top:16px;">
        <button class="btn btn-primary" onclick="crearUsuario()">✅ Crear usuario</button>
      </div>
    </div>
  </div>

</div><!-- /container -->

<script type="module" src="./js/panel.js"></script>

</body>
</html>
