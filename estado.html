<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estado de orden | Cosmica.ar</title>
  <meta name="description" content="Consultá el estado de tu reparación en Cosmica.ar">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:       #050B14;
      --surface:  rgba(15, 23, 42, 0.7);
      --card:     rgba(255, 255, 255, 0.03);
      --border:   rgba(255, 255, 255, 0.08);
      --accent:   #FF5E00;
      --cyan:     #00E5FF;
      --text:     #F8FAFC;
      --muted:    #94A3B8;
      --success:  #10B981;
      --warning:  #F59E0B;
      --danger:   #FF007F;
      --r-card:   20px;
      --r-pill:   50px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    /* ── Background ──────────────────────────────────────────── */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(0,229,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,.025) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .bg-glow {
      position: fixed; top: -160px; left: 50%; z-index: 0; pointer-events: none;
      width: 600px; height: 400px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at center, rgba(0,229,255,.07) 0%, transparent 70%);
    }

    /* ── Layout ─────────────────────────────────────────────── */
    .wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 520px;
      display: flex; flex-direction: column; gap: 16px;
    }

    /* ── Brand header ────────────────────────────────────────── */
    .brand {
      display: flex; align-items: center; gap: 14px;
      padding: 20px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-card);
      backdrop-filter: blur(16px);
    }
    .brand img {
      width: 48px; height: 48px; border-radius: 50%;
      box-shadow: 0 0 16px rgba(0,229,255,.25);
      object-fit: contain; flex-shrink: 0;
    }
    .brand-text { flex: 1; }
    .brand-name {
      font-family: 'DM Sans', sans-serif;
      font-size: 18px; font-weight: 700;
      color: var(--cyan); letter-spacing: -0.3px;
    }
    .brand-tagline { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* ── Glass card ──────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-card);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0,0,0,.4), 0 0 40px rgba(0,229,255,.03);
      overflow: hidden;
    }
    .card-inner { padding: 28px 24px; }

    /* ── Order hero ──────────────────────────────────────────── */
    .hero {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 12px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .hero-label {
      font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .9px;
    }
    .hero-order {
      font-family: 'Rajdhani', sans-serif;
      font-size: 40px; font-weight: 700;
      color: var(--accent); letter-spacing: -1px;
      line-height: 1;
      margin-top: 6px;
    }
    .hero-device {
      font-size: 13px; color: var(--muted); margin-top: 6px;
    }
    .status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      border-radius: var(--r-pill);
      font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .6px;
      white-space: nowrap; flex-shrink: 0;
    }
    .status-badge .dot {
      width: 7px; height: 7px; border-radius: 50%;
      flex-shrink: 0;
    }
    .badge-ingresado { background: rgba(0,229,255,.1); color: var(--cyan); border: 1px solid rgba(0,229,255,.25); }
    .badge-ingresado .dot { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); animation: pulse 2s infinite; }
    .badge-reparacion { background: rgba(255,94,0,.1); color: var(--accent); border: 1px solid rgba(255,94,0,.25); }
    .badge-reparacion .dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: pulse 2s infinite; }
    .badge-listo { background: rgba(16,185,129,.1); color: var(--success); border: 1px solid rgba(16,185,129,.25); }
    .badge-listo .dot { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .badge-entregado { background: rgba(245,158,11,.1); color: var(--warning); border: 1px solid rgba(245,158,11,.25); }
    .badge-entregado .dot { background: var(--warning); }
    .badge-reingresada { background: rgba(255,0,127,.1); color: var(--danger); border: 1px solid rgba(255,0,127,.25); }
    .badge-reingresada .dot { background: var(--danger); animation: pulse 2s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: .4; }
    }

    /* ── Progress stepper ────────────────────────────────────── */
    .stepper {
      display: flex; align-items: flex-start;
      gap: 0; margin-bottom: 24px;
    }
    .step {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; position: relative;
    }
    .step-track {
      width: 100%; height: 3px;
      display: flex; align-items: center;
      position: relative;
    }
    .step-line-left, .step-line-right {
      flex: 1; height: 3px;
      background: var(--border);
      transition: background .4s;
    }
    .step-line-left.filled, .step-line-right.filled { background: var(--cyan); }
    .step:first-child .step-line-left { visibility: hidden; }
    .step:last-child .step-line-right { visibility: hidden; }
    .step-dot {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--bg);
      flex-shrink: 0; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; transition: all .3s;
    }
    .step.done .step-dot {
      background: var(--cyan); border-color: var(--cyan);
      box-shadow: 0 0 10px rgba(0,229,255,.4);
      color: var(--bg);
    }
    .step.active .step-dot {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(255,94,0,.15), 0 0 10px rgba(255,94,0,.3);
      animation: pulse-ring .4s ease;
    }
    .step.done .step-line-left, .step.done .step-line-right,
    .step.active .step-line-left { background: var(--cyan); }
    .step-label {
      font-size: 10px; color: var(--muted); margin-top: 8px;
      text-align: center; font-weight: 500; line-height: 1.2;
    }
    .step.active .step-label { color: var(--accent); font-weight: 600; }
    .step.done .step-label { color: var(--cyan); }

    /* ── Status message ──────────────────────────────────────── */
    .status-msg {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 24px;
    }
    .status-msg strong { color: var(--text); font-weight: 600; }

    /* ── Info grid ───────────────────────────────────────────── */
    .info-grid {
      display: flex; flex-direction: column; gap: 0;
      border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; margin-bottom: 24px;
    }
    .info-row {
      display: flex; justify-content: space-between;
      align-items: baseline; gap: 12px;
      padding: 11px 16px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .key { color: var(--muted); white-space: nowrap; }
    .info-row .val {
      color: var(--text); font-weight: 500;
      text-align: right; word-break: break-word;
    }

    /* ── Timeline ────────────────────────────────────────────── */
    .timeline-title {
      font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .9px;
      margin-bottom: 12px;
    }
    .timeline { display: flex; flex-direction: column; gap: 0; }
    .tl-item {
      display: flex; gap: 12px;
      padding-bottom: 16px; position: relative;
    }
    .tl-item:last-child { padding-bottom: 0; }
    .tl-side {
      display: flex; flex-direction: column; align-items: center;
      width: 28px; flex-shrink: 0;
    }
    .tl-icon {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .tl-line {
      flex: 1; width: 2px; background: var(--border);
      margin-top: 4px; min-height: 12px;
    }
    .tl-item:last-child .tl-line { display: none; }
    .tl-body { flex: 1; padding-top: 4px; }
    .tl-label { font-size: 13px; font-weight: 600; color: var(--text); }
    .tl-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .tl-created .tl-icon { background: rgba(0,229,255,.1); color: var(--cyan); border-color: rgba(0,229,255,.2); }
    .tl-progress .tl-icon { background: rgba(255,94,0,.1); color: var(--accent); border-color: rgba(255,94,0,.2); }
    .tl-done .tl-icon { background: rgba(16,185,129,.1); color: var(--success); border-color: rgba(16,185,129,.2); }
    .tl-delivered .tl-icon { background: rgba(245,158,11,.1); color: var(--warning); border-color: rgba(245,158,11,.2); }
    .tl-reingest .tl-icon { background: rgba(255,0,127,.1); color: var(--danger); border-color: rgba(255,0,127,.2); }

    /* ── Footer ──────────────────────────────────────────────── */
    .footer {
      text-align: center; font-size: 12px; color: var(--muted);
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      line-height: 1.5;
    }
    .footer a { color: var(--cyan); text-decoration: none; }

    /* ── Loading / Error ─────────────────────────────────────── */
    .state-box {
      padding: 40px 24px; text-align: center;
    }
    .state-spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--cyan);
      animation: spin .8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .state-sub { font-size: 13px; color: var(--muted); line-height: 1.5; }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 400px) {
      .hero-order { font-size: 32px; }
      .step-label { font-size: 9px; }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="wrap">

    <!-- Brand -->
    <header class="brand">
      <img src="cosmica-logo.png" alt="Cosmica.ar">
      <div class="brand-text">
        <div class="brand-name">Cosmica.ar</div>
        <div class="brand-tagline">Servicio técnico · Seguimiento de orden</div>
      </div>
    </header>

    <!-- Main content injected here -->
    <main id="content" class="card">
      <div class="state-box">
        <div class="state-spinner"></div>
        <div class="state-title">Consultando orden...</div>
        <div class="state-sub">Estamos recuperando el estado de tu reparación.</div>
      </div>
    </main>

  </div>

  <script type="module" src="./js/estado.js?v=20260514-redesign"></script>
</body>
</html>
