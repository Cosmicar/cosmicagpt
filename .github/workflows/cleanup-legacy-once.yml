name: Limpieza definitiva del legado

on:
  push:
    branches:
      - cleanup/remove-legacy-junk
    paths:
      - .github/workflows/cleanup-legacy-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama de limpieza
        uses: actions/checkout@v4
        with:
          ref: cleanup/remove-legacy-junk
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Eliminar aplicación y artefactos históricos
        shell: bash
        run: |
          rm -rf \
            apps \
            release \
            js \
            components \
            core \
            services \
            views \
            docs \
            .vscode \
            test-results \
            playwright-report \
            tmp

          rm -f \
            panel.html \
            login.html \
            estado.html \
            redesign.html \
            indexold1.html \
            firebase-messaging-sw.js \
            manifest.json \
            sw.js \
            MIGRATION_RUNBOOK.md \
            SYSTEM_OVERVIEW.md \
            dev-server.err.log \
            dev-server.out.log \
            firestore.rules \
            .vercelignore

      - name: Validar fronteras del proyecto
        run: node scripts/validate-project-boundaries.mjs

      - name: Regenerar y validar la web pública
        run: node scripts/validate-marketing.mjs

      - name: Retirar workflow temporal y guardar limpieza
        shell: bash
        run: |
          rm -f .github/workflows/cleanup-legacy-once.yml
          git add -A

          if git diff --cached --quiet; then
            echo 'No había residuos adicionales para eliminar.'
            exit 0
          fi

          git config user.name 'cosmica-cleanup-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'chore: eliminar aplicación y artefactos legacy'
          git push origin cleanup/remove-legacy-junk
