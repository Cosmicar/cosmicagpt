<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmica.ar — Acceso</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050B14;
      --surface: rgba(15, 23, 42, 0.6);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #FF5E00; /* Vibrant Orange */
      --accent-dim: rgba(255,94,0,.08);
      --accent2: #00E5FF; /* Electric Blue */
      --text: #F8FAFC;
      --muted: #94A3B8;
      --danger: #FF007F; /* Magenta */
      --radius-pill: 50px;
      --radius-card: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Fondo animado */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(0,229,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 20s linear infinite;
    }
    @keyframes gridMove {
      0%   { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }
    .bg-glow {
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(0,229,255,.06) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      pointer-events: none; z-index: 0;
    }

    /* Card */
    .card {
      position: relative; z-index: 1;
      background: var(--surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 80px rgba(0,0,0,.6), 0 0 40px rgba(0,229,255,.04);
      animation: fadeUp .5s ease both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(20px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .logo {
      text-align: center;
      margin-bottom: 36px;
    }
    .logo-icon {
      width: 64px; height: 64px;
      background: rgba(0,229,255,0.05);
      border: 1px solid rgba(0,229,255,.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px;
      padding: 10px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,229,255,0.2);
    }
    .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .logo-title {
      font-family: 'Inter', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--accent2);
    }
    .logo-title span { color: var(--text); }
    .logo-sub {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 6px;
    }

    /* Form */
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .8px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      padding: 14px 16px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      transition: all .2s;
      outline: none;
    }
    input:focus {
      border-color: var(--accent2);
      box-shadow: 0 0 0 3px rgba(0,229,255,.1);
      background: rgba(255,255,255,0.05);
    }
    input::placeholder { color: var(--muted); }

    .btn-login {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-pill);
      padding: 16px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 10px;
      transition: all .2s;
      box-shadow: 0 4px 15px rgba(255,94,0,0.3);
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255,94,0,.5);
      filter: brightness(1.1);
    }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled {
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Error */
    .error-msg {
      background: rgba(255,0,127,.1);
      border: 1px solid rgba(255,0,127,.3);
      color: var(--danger);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 500;
      margin-top: 16px;
      display: none;
    }
    .error-msg.show { display: block; animation: shake .3s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }

    .footer-text {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 36px;
      letter-spacing: .5px;
    }
  </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <img src="cosmica-logo.png" alt="Cosmica.ar">
    </div>
    <div class="logo-title">Cosmica<span>.ar</span></div>
    <div class="logo-sub">Sistema de gestión</div>
  </div>

  <div class="form-group">
    <label>Email</label>
    <input id="email" type="email" placeholder="usuario@cosmica.ar" autocomplete="username">
  </div>

  <div class="form-group">
    <label>Contraseña</label>
    <input id="password" type="password" placeholder="••••••••"
      autocomplete="current-password"
      onkeydown="if(event.key==='Enter') login()">
  </div>

  <button class="btn-login" id="btnLogin" onclick="login()">Ingresar</button>
  <div class="error-msg" id="errorMsg"></div>

  <div class="footer-text">Cosmica.ar © 2026 — Jujuy, Argentina</div>
</div>

<script type="module" src="./js/login.js"></script>

</body>
</html>
