<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estado de orden | Cosmica.ar</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050B14;
      --surface: rgba(15, 23, 42, 0.6);
      --card: rgba(255, 255, 255, 0.02);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #FF5E00; /* Vibrant Orange */
      --accent2: #00E5FF; /* Electric Blue */
      --text: #F8FAFC;
      --muted: #94A3B8;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #FF007F; /* Magenta */
      --radius-pill: 50px;
      --radius-card: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(0,229,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .card {
      position: relative; z-index: 1;
      width: 100%;
      max-width: 460px;
      background: var(--surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 34px 28px;
      box-shadow: 0 24px 70px rgba(0,0,0,.45), 0 0 40px rgba(0,229,255,.04);
    }
    .brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand img {
      width: 68px; height: 68px;
      object-fit: contain;
      display: block;
      margin: 0 auto 12px;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0,229,255,0.2);
    }
    .brand-title {
      font-family: 'Inter', sans-serif;
      color: var(--accent2);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .brand-sub {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      margin-top: 6px;
    }
    .status-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }
    .label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .9px;
    }
    .order {
      font-family: 'Inter', sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--accent);
      margin-top: 8px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      margin-top: 16px;
      padding: 8px 20px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
      background: rgba(0,229,255,.1);
      color: var(--accent2);
      border: 1px solid rgba(0,229,255,.3);
    }
    .badge.listo { background: rgba(16,185,129,.1); color: var(--success); border-color: rgba(16,185,129,.3); }
    .badge.entregado { background: rgba(245,158,11,.1); color: var(--warning); border-color: rgba(245,158,11,.3); }
    .info {
      margin-top: 24px;
      display: grid;
      gap: 12px;
      text-align: left;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .row:last-child { border-bottom: none; padding-bottom: 0; }
    .row b { color: var(--text); font-weight: 600; text-align: right; }
    .message {
      margin-top: 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }
    .error {
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
      padding: 30px 12px;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <main class="card">
    <div class="brand">
      <img src="cosmica-logo.png" alt="Cosmica.ar">
      <div class="brand-title">Cosmica.ar</div>
      <div class="brand-sub">Muchas gracias por confiar en nosotros</div>
    </div>

    <section id="content" class="status-box">
      <div class="error">Consultando estado de la orden...</div>
    </section>
  </main>

  <script type="module" src="./js/estado.js?v=20260503-public-bridge"></script>
</body>
</html>
