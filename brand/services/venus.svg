<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Venus</title>
  <desc id="desc">Representación decorativa cálida y atmosférica de Venus.</desc>
  <defs>
    <radialGradient id="surface" cx="34%" cy="27%" r="76%">
      <stop offset="0" stop-color="#f1d59f"/>
      <stop offset=".36" stop-color="#c9985b"/>
      <stop offset=".7" stop-color="#8b5a37"/>
      <stop offset="1" stop-color="#2f2523"/>
    </radialGradient>
    <linearGradient id="bands" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff1c7" stop-opacity=".34"/>
      <stop offset="1" stop-color="#713e2c" stop-opacity=".05"/>
    </linearGradient>
    <radialGradient id="shade" cx="28%" cy="24%" r="82%">
      <stop offset="0" stop-color="#fff" stop-opacity=".24"/>
      <stop offset=".62" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#0f121a" stop-opacity=".68"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="13"/></filter>
    <clipPath id="planet"><circle cx="160" cy="160" r="118"/></clipPath>
  </defs>
  <circle cx="160" cy="174" r="121" fill="#000" opacity=".30" filter="url(#shadow)"/>
  <g clip-path="url(#planet)">
    <circle cx="160" cy="160" r="118" fill="url(#surface)"/>
    <g fill="none" stroke="url(#bands)" stroke-linecap="round">
      <path d="M48 112c55 30 113 17 216-18" stroke-width="18"/>
      <path d="M40 151c67 21 137 9 239-28" stroke-width="13"/>
      <path d="M52 194c78 17 143 2 221-27" stroke-width="19"/>
      <path d="M73 229c70 12 124 1 183-19" stroke-width="10"/>
    </g>
    <circle cx="160" cy="160" r="118" fill="url(#shade)"/>
  </g>
</svg>