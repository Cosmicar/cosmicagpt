<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Planeta X</title>
  <desc id="desc">Representación decorativa oscura de Planeta X con halo carmesí.</desc>
  <defs>
    <radialGradient id="surface" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#3a2630"/>
      <stop offset=".42" stop-color="#261a23"/>
      <stop offset=".74" stop-color="#171720"/>
      <stop offset="1" stop-color="#07090e"/>
    </radialGradient>
    <radialGradient id="rim" cx="33%" cy="28%" r="74%">
      <stop offset=".6" stop-color="#E1063A" stop-opacity="0"/>
      <stop offset=".84" stop-color="#E1063A" stop-opacity=".26"/>
      <stop offset="1" stop-color="#E1063A" stop-opacity=".72"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="15"/></filter>
    <clipPath id="planet"><circle cx="160" cy="160" r="116"/></clipPath>
  </defs>
  <circle cx="160" cy="160" r="127" fill="#E1063A" opacity=".20" filter="url(#glow)"/>
  <g clip-path="url(#planet)">
    <circle cx="160" cy="160" r="116" fill="url(#surface)"/>
    <g fill="none" stroke="#E1063A" stroke-opacity=".16" stroke-linecap="round">
      <path d="M79 102c52 18 110 11 168-18" stroke-width="5"/>
      <path d="M64 156c72 20 143 10 208-23" stroke-width="4"/>
      <path d="M86 211c52 12 104 7 156-14" stroke-width="5"/>
    </g>
    <circle cx="160" cy="160" r="116" fill="url(#rim)"/>
    <ellipse cx="126" cy="113" rx="54" ry="33" fill="#fff" opacity=".035" transform="rotate(-18 126 113)"/>
  </g>
  <circle cx="160" cy="160" r="116" fill="none" stroke="#E1063A" stroke-opacity=".34" stroke-width="2"/>
</svg>